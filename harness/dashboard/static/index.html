<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f7f7f8; --panel:#fff; --text:#1b1b1f; --muted:#6b6b76; --line:#e2e2e7; --accent:#4b5cf0; --ok:#1f8a4c; --bad:#c8372d; --warn:#b7791f; --on-accent:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111114; --panel:#1b1b20; --text:#ececf1; --muted:#9a9aa6; --line:#2c2c33; --accent:#8c98ff; --ok:#4cc38a; --bad:#ff6b5e; --warn:#f0b75a; --on-accent:#111114; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:20px; font-weight:650; margin:0 12px 0 0; }
  select, button { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
  button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  button:disabled { opacity:.5; }
  main { display:grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0; }
  h2 { font-size:15px; font-weight:600; letter-spacing:.01em; margin:0 0 8px; }
  .graph svg { max-width:100%; height:auto; }
  .graph .node.active rect, .graph .node.active polygon, .graph .node.active circle { stroke:var(--accent) !important; stroke-width:3px !important; fill:color-mix(in srgb, var(--accent) 25%, transparent) !important; }
  .graph .node.error rect { stroke:var(--bad) !important; stroke-width:3px !important; }
  .graphs { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr); gap:12px; align-items:start; }
  @media (max-width: 600px) { .graphs { grid-template-columns:1fr; } }
  h3 { font-size:12px; color:var(--muted); margin:0 0 4px; font-weight:500; }
  #workers { margin:8px 0 0; display:flex; gap:6px; flex-wrap:wrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr.sel { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  tr[data-run] { cursor:pointer; }
  .tag { font-size:11px; padding:1px 6px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .k-end { color:var(--ok); } .k-error, .k-paused { color:var(--bad); } .k-start { color:var(--muted); }
  pre { white-space:pre-wrap; word-break:break-word; font-size:12px; background:var(--bg); padding:8px; border-radius:6px; max-height:260px; overflow:auto; margin:0; }
  .meter { height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
  .meter > div { height:100%; background:var(--accent); }
  .muted { color:var(--muted); }
  .scroll { max-height:320px; overflow:auto; }
  .k-waiting { color:var(--warn); }
  .question { margin:10px 0 0; padding:10px; border:1px solid var(--warn); border-radius:8px; display:grid; gap:6px; }
  .question form { display:flex; gap:6px; flex-wrap:wrap; }
  .question input { flex:1 1 200px; font:inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
</style>
</head>
<body>
<header>
  <h1>Harness</h1>
  <select id="scenario" aria-label="Scénář"></select>
  <label><input type="checkbox" id="stepMode"> krokovat</label>
  <button class="primary" id="start">Spustit simulaci</button>
  <button id="step" disabled>Další krok</button>
  <span id="status" class="muted"></span>
</header>
<main>
  <section><h2>Graf</h2>
    <div class="graphs"><div><h3>Běh (dávky přes Send)</h3><div id="graph" class="graph"></div></div>
      <div><h3>Worker (subgraf, jeden na úkol)</h3><div id="wgraph" class="graph"></div></div></div>
    <div id="workers" aria-live="polite"></div>
    <div id="questions" aria-live="polite"></div>
    <h2 style="margin-top:12px">Detail uzlu</h2><pre id="detail">Klikni na uzel nebo event.</pre></section>
  <section><h2>Běhy</h2><div class="scroll"><table id="runs"></table></div>
    <h2 style="margin-top:12px">Události běhu</h2><div class="scroll"><table id="events"></table></div>
    <h2 style="margin-top:12px">Volání agentů</h2><div class="scroll"><table id="calls"></table></div></section>
  <section><h2>Backlog</h2><table id="backlog"></table></section>
  <section><h2>Spotřeba</h2><div id="quota"></div><table id="usage"></table></section>
  <section><h2>Cena za úkol</h2><div class="scroll"><table id="cost-summary"></table><table id="costs"></table></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js" integrity="sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2" crossorigin="anonymous"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (path, opts) => { const r = await fetch(path, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); };
let selectedRun = null, lastEventId = 0, lastNodeData = {}, active = {};

function nodeEl(name) { return document.querySelector(`.graph [id*="flowchart-${name}-"]`); }
function paint(marks) {
  document.querySelectorAll(".graph .node").forEach((n) => n.classList.remove("active", "error"));
  marks.forEach(([name, cls]) => nodeEl(name)?.classList.add(cls));
}
// active = { workerId|"": {node, cls} } — one entry per running worker, "" for the parent graph
function track(e) {
  if (!e.node) return;
  const key = e.worker ?? "";
  if (e.kind === "start") active[key] = { node: e.node, cls: "active" };
  else if (e.kind === "error") active[key] = { node: e.node, cls: "error" };
  else if (e.kind === "end" && (e.node === "report" || e.node === "pick_tasks")) delete active[key];
}
function paintActive() {
  const entries = Object.entries(active);
  const marks = entries.map(([, a]) => [a.node, a.cls]);
  if (entries.some(([w]) => w)) marks.push(["worker", "active"]);
  paint(marks);
  $("workers").innerHTML = entries.filter(([w]) => w).map(([w, a]) =>
    `<span class="tag">${esc(w)} → ${esc(a.node)}</span>`).join("");
}

async function renderGraph() {
  const { mermaid: src, worker } = await api("/graph");
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default" });
  $("graph").innerHTML = (await mermaid.render("g1", src)).svg;
  $("wgraph").innerHTML = (await mermaid.render("g2", worker)).svg;
  document.querySelectorAll(".graph .node").forEach((n) => {
    const name = n.id.replace(/^.*?flowchart-/, "").replace(/-\d+$/, "");
    n.style.cursor = "pointer";
    n.onclick = () => { $("detail").textContent = JSON.stringify(lastNodeData[name] ?? { node: name, info: "zatím bez dat v tomto běhu" }, null, 2); };
  });
}

async function loadScenarios() {
  const list = await api("/scenarios");
  $("scenario").innerHTML = list.map((s) => `<option value="${esc(s.name)}">${esc(s.title)}</option>`).join("");
}

async function loadRuns() {
  const runs = await api("/runs");
  $("runs").innerHTML = "<tr><th>Běh</th><th>Typ</th><th>Stav</th></tr>" + runs.slice(0, 30).map((r) =>
    `<tr data-run="${esc(r.run_id)}" class="${r.run_id === selectedRun ? "sel" : ""}"><td>${esc(r.run_id)}</td><td><span class="tag">${r.simulated ? "sim" : "real"}</span></td><td class="k-${esc(r.last_kind)}">${esc(r.last_kind)}</td></tr>`).join("");
  $("runs").querySelectorAll("tr[data-run]").forEach((tr) => tr.onclick = () => selectRun(tr.dataset.run));
}

async function selectRun(runId) {
  selectedRun = runId; lastNodeData = {}; active = {};
  const evs = await api(`/runs/${encodeURIComponent(runId)}/events`);
  $("events").innerHTML = "";
  evs.forEach((e) => { addEventRow(e); track(e); });
  if (["run_end", "paused", "waiting"].includes(evs.at(-1)?.kind)) active = {};
  paintActive();
  await Promise.all([loadRuns(), loadBacklog(), loadCalls(), refreshStepButton()]);
}

// subscription cost is only the SDK's list-price estimate; API cost was really paid
const price = (cost, paid = 0) => {
  const est = (cost ?? 0) - (paid ?? 0), parts = [];
  if (est.toFixed(2) !== "0.00") parts.push(`≈$${est.toFixed(2)}`);
  if ((paid ?? 0).toFixed(2) !== "0.00") parts.push(`$${paid.toFixed(2)} API`);
  return parts.join(" + ") || "$0.00";
};
const tokens = (c) => (c.input_tokens ?? 0) + (c.output_tokens ?? 0) + (c.cache_read_tokens ?? 0) + (c.cache_write_tokens ?? 0);

async function loadCalls() {
  if (!selectedRun) return;
  const calls = await api(`/runs/${encodeURIComponent(selectedRun)}/calls`);
  $("calls").innerHTML = calls.length ? "<tr><th>Uzel</th><th>Worker</th><th>Model</th><th>Tahy</th><th>Kroky</th><th>Tokeny</th><th title="≈ odhad u subscription, API = skutečně zaplaceno">Cena</th><th>Stav</th></tr>" + calls.map((c) =>
    `<tr data-call="${c.id}" style="cursor:pointer"><td>${esc(c.node)}</td><td class="muted">${esc(c.worker)}</td><td>${esc(c.model)}</td><td>${c.num_turns ?? ""}</td><td>${c.steps}</td><td>${tokens(c)}</td><td>${price(c.cost_usd, c.billing === "api" ? c.cost_usd : 0)}</td><td class="${c.status === "ok" ? "" : "k-error"}">${esc(c.status)}</td></tr>`).join("")
    : '<tr><td class="muted">Žádná zaznamenaná volání (simulace nebo běh před fází 4).</td></tr>';
  $("calls").querySelectorAll("tr[data-call]").forEach((tr) => tr.onclick = () => showSteps(tr.dataset.call));
}

async function showSteps(callId) {
  const steps = await api(`/calls/${callId}/steps`);
  $("detail").textContent = steps.map((s) => `${String(s.seq).padStart(3)} ${s.kind.padEnd(11)} ${s.tool ?? ""}${s.is_error ? " ✗" : ""}\n    ${s.summary}`).join("\n") || "Volání bez kroků.";
}

async function loadCosts() {
  const { tasks, overhead, summary } = await api("/costs");
  $("cost-summary").innerHTML = "<tr><th>Projekt</th><th>Model plánovače</th><th>Úkolů</th><th>merged</th><th>closed</th><th>[!]</th><th>[?]</th><th>open</th><th>Cena celkem</th><th>Za merged</th></tr>" + summary.map((g) =>
    `<tr><td>${esc(g.project)}</td><td class="muted">${esc(g.plan_model)}</td><td>${g.tasks}</td><td>${g.merged}</td><td>${g.closed}</td><td>${g.failed}</td><td>${g.unclear}</td><td>${g.open}</td><td>$${g.cost_usd.toFixed(2)}</td><td>${g.cost_per_merged == null ? "-" : "$" + g.cost_per_merged.toFixed(2)}</td></tr>`).join("");
  $("costs").innerHTML = "<tr><th>Úkol</th><th>Projekt</th><th>Stav</th><th>Pokusy</th><th>Tokeny</th><th title="≈ odhad u subscription, API = skutečně zaplaceno">Cena</th></tr>" + tasks.map((t) =>
    `<tr><td>${t.pr_url ? `<a href="${esc(t.pr_url)}" target="_blank" rel="noopener">${esc(t.task_id)}</a>` : esc(t.task_id)}</td><td class="muted">${esc(t.project)}</td><td>${esc(t.state ?? "-")}</td><td>${t.attempts}</td><td>${t.tokens}</td><td>${price(t.cost_usd, t.paid_usd)}</td></tr>`).join("") +
    overhead.map((o) => `<tr class="muted"><td colspan="3">režie ${esc(o.run_id)} · ${esc(o.node)}</td><td>${o.calls}×</td><td>${o.tokens}</td><td>${price(o.cost_usd, o.paid_usd)}</td></tr>`).join("");
}

function addEventRow(e) {
  if (e.node && e.kind !== "start") lastNodeData[e.node] = e;
  const t = new Date(e.ts * 1000).toLocaleTimeString();
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="muted">${t}</td><td class="muted">${esc(e.worker ?? "")}</td><td>${esc(e.node ?? "")}</td><td class="k-${esc(e.kind)}">${esc(e.kind)}</td>`;
  tr.style.cursor = "pointer";
  tr.onclick = () => { $("detail").textContent = JSON.stringify(e, null, 2); };
  $("events").prepend(tr);
}

async function loadBacklog() {
  const q = selectedRun?.startsWith("sim-") ? `?sim=${encodeURIComponent(selectedRun)}` : "";
  const tasks = await api(`/backlog${q}`);
  $("backlog").innerHTML = "<tr><th>Stav</th><th>P</th><th>Úkol</th><th>Projekt</th></tr>" + tasks.map((t) =>
    `<tr><td>[${esc(t.status)}]</td><td>P${t.priority}</td><td>${esc(t.id)} ${esc(t.title)}</td><td class="muted">${esc(t.project)}</td></tr>`).join("");
}

async function loadUsage() {
  const { summary, rate_limit } = await api("/usage");
  const util = rate_limit?.utilization;
  $("quota").innerHTML = util == null ? '<p class="muted">Kvóta: zatím žádná data ze skutečného běhu.</p>' :
    `<p>Okno ${esc(rate_limit.type)}: ${(util * 100).toFixed(0)} %${rate_limit.resets_at ? ", reset " + new Date(rate_limit.resets_at * 1000).toLocaleTimeString() : ""}</p><div class="meter"><div style="width:${Math.min(util * 100, 100)}%"></div></div>`;
  $("usage").innerHTML = "<tr><th>Den</th><th>Uzel</th><th>Model</th><th>Tokeny</th><th title="≈ odhad u subscription, API = skutečně zaplaceno">Cena</th></tr>" + summary.map((u) =>
    `<tr><td>${esc(u.day)}${u.simulated ? ' <span class="tag">sim</span>' : ""}</td><td>${esc(u.node)}</td><td>${esc(u.model)}</td><td>${u.input_tokens + u.output_tokens + (u.cache_tokens ?? 0)}</td><td>${price(u.cost_usd, u.paid_usd)}</td></tr>`).join("");
}

async function refreshStepButton() {
  if (!selectedRun) return;
  try {
    const st = await api(`/runs/${encodeURIComponent(selectedRun)}/state`);
    $("step").disabled = st.running || st.next.length === 0;
    if (st.running) { $("status").textContent = "krok běží…"; setTimeout(refreshStepButton, 300); return; }
    $("status").textContent = st.next.length ? `čeká před: ${st.next.join(", ")}` : "";
    if (st.next.length) paint([...st.next, ...(st.next.includes("pick_tasks") ? [] : ["worker"])].map((n) => [n, "active"]));
    renderQuestions(st.questions ?? []);
  } catch { $("step").disabled = true; renderQuestions([]); }
}

function renderQuestions(qs) {
  if (qs.length) $("step").disabled = true;  // answering resumes the run, a step would resume it unanswered
  $("questions").innerHTML = qs.map((q) => `<div class="question"><div><strong>${esc(q.task)}</strong> ${esc(q.title)} se ptá:</div>
    <div>${esc(q.question)}</div><form data-id="${esc(q.id)}"><input aria-label="Odpověď" placeholder="Odpověď…">
    <button class="primary" type="submit">Odpovědět</button><button type="button" data-skip>Přeskočit</button></form></div>`).join("");
  $("questions").querySelectorAll("form").forEach((f) => {
    const send = async (answer) => {
      f.querySelectorAll("button").forEach((b) => b.disabled = true);
      await api(`/runs/${encodeURIComponent(selectedRun)}/answer`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: f.dataset.id, answer }) });
      $("questions").innerHTML = "";
      setTimeout(refreshStepButton, 300);
    };
    f.onsubmit = (ev) => { ev.preventDefault(); send(f.querySelector("input").value); };
    f.querySelector("[data-skip]").onclick = () => send("");
  });
}

$("start").onclick = async () => {
  const { run_id } = await api("/simulate", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ scenario: $("scenario").value, step: $("stepMode").checked }) });
  await selectRun(run_id);
  setTimeout(refreshStepButton, 300);
};
$("step").onclick = async () => {
  $("step").disabled = true;
  await api(`/runs/${encodeURIComponent(selectedRun)}/step`, { method: "POST" });
  setTimeout(refreshStepButton, 300);
};

function listen() {
  const es = new EventSource(`/events/stream?after=${lastEventId}`);
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    lastEventId = e.id;
    if (e.run_id === selectedRun) {
      addEventRow(e);
      track(e);
      if (["run_end", "paused", "waiting"].includes(e.kind)) { active = {}; $("status").textContent = e.kind; }
      if (e.kind === "waiting") refreshStepButton();
      paintActive();
      if (e.kind === "end" && (e.node === "report" || e.node === "pick_tasks")) loadBacklog();
      if (e.kind === "end") refreshStepButton();
    }
    if (["run_start", "run_end", "paused", "waiting"].includes(e.kind)) loadRuns();
    if (e.usage) { loadUsage(); loadCosts(); if (e.run_id === selectedRun) loadCalls(); }
  };
}

(async () => {
  await Promise.all([renderGraph(), loadScenarios(), loadRuns(), loadBacklog(), loadUsage(), loadCosts()]);
  const runs = await api("/runs");
  if (runs.length) {
    const evs = await api(`/runs/${encodeURIComponent(runs[0].run_id)}/events`);
    lastEventId = Math.max(0, ...evs.map((e) => e.id));
  }
  listen();
})();
</script>
</body>
</html>
