<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Desktop</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0e0f13; --panel:rgba(27,28,34,.86); --text:#ececf1; --muted:#9a9aa6; --line:#2c2d35; --accent:#8c98ff;
          --ok:#4cc38a; --bad:#ff6b5e; --warn:#f0b75a; --on-accent:#111114; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font:15px/1.45 system-ui, sans-serif; color:var(--text);
         background:var(--bg); }
  /* left gutter for desktop icons, bottom for the taskbar */
  .wrap { padding:28px 32px 72px 140px; display:grid; gap:16px; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); align-items:start; }
  @media (max-width:1100px) { .wrap { grid-template-columns:1fr; padding:16px; } }
  .col { display:grid; gap:16px; min-width:0; }
  /* the wallpaper (Lively) may get no mouse wheel: each column scrolls by its scrollbar or by dragging the content;
     rtl puts the left column's scrollbar on its outer edge instead of mid-screen */
  @media (min-width:1101px) {
    .wrap { height:100vh; grid-template-rows:auto minmax(0,1fr); }
    .wrap > .col { max-height:100%; overflow-y:auto; padding-right:6px; scrollbar-color:var(--muted) transparent; }
    .wrap > .col.left { direction:rtl; padding:0 0 0 6px; }
    .wrap > .col.left > * { direction:ltr; }
    .wrap > .col.dragging { cursor:grabbing; user-select:none; }
  }
  header { grid-column:1 / -1; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:26px; font-weight:700; margin:0 12px 0 0; letter-spacing:-.01em; }
  h2 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  h3 { font-size:17px; font-weight:650; margin:0; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; backdrop-filter:blur(6px); min-width:0; }
  button { font:inherit; padding:6px 12px; border-radius:7px; border:1px solid var(--line); background:#22232b; color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  input[type=number] { font:inherit; width:4em; padding:1px 4px; border-radius:5px; border:1px solid var(--line); background:#15161b; color:var(--text); }
  input[type=text] { font:inherit; padding:6px 10px; border-radius:7px; border:1px solid var(--line); background:#15161b; color:var(--text); flex:1 1 220px; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .muted { color:var(--muted); }
  .status { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block; }
  .dot.running { background:var(--accent); }
  .dot.waiting, .dot.approving, .dot.paused { background:var(--warn); }
  .dot.crashed { background:var(--bad); } .dot.done { background:var(--ok); }
  .spacer { flex:1; }
  .projects { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }
  .counts { display:flex; gap:12px; margin:6px 0 10px; font-size:13px; flex-wrap:wrap; }
  .counts b { font-size:16px; }
  ul { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:minmax(0,1fr); gap:6px; }
  h4 { font-size:12px; font-weight:600; color:var(--muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.05em; }
  li.prop { display:flex; gap:6px; align-items:center; font-size:14px; min-width:0; }
  li.prop details { flex:1; min-width:0; }
  li.prop summary { color:var(--text); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li.prop button { padding:2px 8px; }
  li.pr { display:flex; gap:8px; align-items:baseline; font-size:14px; min-width:0; }
  li.pr a { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
  li.conflict { font-size:13px; margin:2px 0 8px; padding:4px 8px; border-left:3px solid var(--bad); }
  li.conflict pre { white-space:pre-wrap; max-height:8em; overflow:auto; font-size:12px; margin:4px 0; }
  li.conflict .row { margin-top:4px; }
  li.conflict button { padding:2px 8px; font-size:13px; }
  .tag { font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .tag.draft { border-color:var(--warn); color:var(--warn); }
  .item { border-top:1px solid var(--line); padding:10px 0; display:grid; gap:6px; }
  .item:first-of-type { border-top:0; padding-top:0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; }
  details p { margin:6px 0 0; font-size:13px; white-space:pre-wrap; }
  .attention { border-color:var(--warn); }
  pre.plan { white-space:pre-wrap; max-height:24em; overflow:auto; font-size:12px; margin:4px 0; }
  .meter { height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin:6px 0; }
  .meter > div { height:100%; background:var(--accent); }
  .meter.high > div { background:var(--warn); }
  .chart svg { width:100%; height:140px; display:block; }
  .chart rect { fill:var(--accent); opacity:.85; } .chart rect:hover { opacity:1; }
  .chart text { fill:var(--muted); font-size:10px; }
  .big { font-size:22px; font-weight:700; }
  #toast { position:fixed; right:24px; bottom:80px; background:var(--panel); border:1px solid var(--accent); padding:10px 14px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  label.plan { display:flex; gap:8px; align-items:baseline; }
  #scope { flex-basis:100%; font-size:13px; }
  label.chip { display:inline-flex; gap:5px; align-items:center; padding:3px 10px; border:1px solid var(--line); border-radius:99px; cursor:pointer; }
  label.chip:has(input:checked) { border-color:var(--accent); }
  .tag.ok { border-color:var(--ok); color:var(--ok); } .tag.fail { border-color:var(--bad); color:var(--bad); }
  li.pr button { padding:1px 8px; font-size:13px; }
  .actions { display:grid; gap:12px; grid-template-columns:repeat(3, 1fr); }
  @media (max-width:700px) { .actions { grid-template-columns:1fr; } }
  button.action { display:grid; gap:4px; text-align:left; padding:14px 16px; border-radius:10px; border-width:2px; }
  button.action b { font-size:17px; }
  button.action span { font-size:13px; color:var(--muted); }
  button.action.primary span { color:inherit; opacity:.75; }
  button.small { padding:2px 9px; font-size:13px; }
  .pipe { display:flex; gap:6px; align-items:stretch; flex-wrap:wrap; margin:14px 0 4px; }
  .stage { flex:1 1 100px; border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:13px; transition:opacity .15s; }
  .stage small { display:block; color:var(--muted); font-size:11px; }
  .arrow { align-self:center; color:var(--muted); }
  :is(.stage, .node).done { border-color:var(--ok); }
  :is(.stage, .node).active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  :is(.stage, .node).wait { border-color:var(--warn); box-shadow:0 0 0 1px var(--warn); }
  :is(.stage, .node).error { border-color:var(--bad); }
  :is(.stage, .node):is(.active, .wait)::before { content:"● "; color:var(--accent); }
  :is(.stage, .node).wait::before { color:var(--warn); }
  :is(.stage, .node).done::before { content:"✓ "; color:var(--ok); }
  :is(.stage, .node).error::before { content:"✗ "; color:var(--bad); }
  #flow[data-preview] .stage:not(.on-preview), #flow[data-preview] .arrow, #flow[data-preview] #workers { opacity:.25; }
  #flow[data-preview] .stage.on-preview { border-color:var(--accent); }
  #flowHint { font-size:13px; min-height:20px; margin-top:6px; }
  .wrow { display:flex; gap:5px; align-items:center; flex-wrap:wrap; font-size:12px; padding:6px 0; border-top:1px solid var(--line); }
  .wrow .title { flex:1 1 100%; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node { border:1px solid var(--line); border-radius:99px; padding:1px 8px; color:var(--muted); }
  .node.done, .node.active, .node.wait, .node.error { color:var(--text); }
  #subtitle { display:none; }
  button[aria-pressed=true] { border-color:var(--accent); }

  /* SAMM: the dairy parody skin — same data, only restyled */
  body.samm { --bg:#fffdf5; --panel:#fff; --text:#2b1d0e; --muted:#7a6650; --line:#2b1d0e; --accent:#ff8fb1;
              --ok:#3f9b3f; --bad:#c0392b; --warn:#e6a100; --on-accent:#2b1d0e;
              font-family:"Comic Sans MS", "Chalkboard SE", cursive;
              background:linear-gradient(#bfe6ff 0 55%, #8ed16f 55% 100%) fixed; }
  /* hand-drawn wobble: uneven corner radii + hard offset shadow */
  body.samm section { border-width:3px; border-radius:22px 34px 18px 30px / 30px 18px 34px 22px; backdrop-filter:none;
    background:radial-gradient(circle at calc(100% + 6px) -6px, #1a1a1a 0 26px, transparent 27px),
               radial-gradient(ellipse 22px 14px at calc(100% - 4px) calc(100% + 2px), #1a1a1a 99%, transparent), #fff;
    box-shadow:6px 7px 0 #2b1d0e; }
  body.samm h1 { font-size:34px; color:#fff; -webkit-text-stroke:1.5px #2b1d0e; text-shadow:3px 3px 0 var(--accent); }
  body.samm #subtitle { display:block; flex-basis:100%; margin-top:-10px; font-style:italic; color:#2b1d0e; }
  body.samm h2 { display:inline-block; color:#2b1d0e; background:#fff3a8; border:2px solid #2b1d0e; border-radius:8px 14px 9px 12px;
    padding:2px 10px; transform:rotate(-1.5deg); box-shadow:2px 2px 0 #2b1d0e; }
  body.samm button { background:#fff3a8; border:3px solid #2b1d0e; border-radius:16px 22px 14px 20px / 20px 14px 22px 16px;
    color:var(--text); font-weight:700; box-shadow:3px 3px 0 #2b1d0e; transition:transform .08s, box-shadow .08s; }
  body.samm button:not(:disabled):hover { transform:translate(-1px, -2px) rotate(-1deg); box-shadow:4px 5px 0 #2b1d0e; }
  body.samm button:not(:disabled):active { transform:translate(3px, 3px); box-shadow:0 0 0 #2b1d0e; }
  body.samm button.primary { background:var(--accent); }
  body.samm button[aria-pressed=true] { background:#9be7ff; }
  body.samm button.action { border-radius:34px 46px 26px 40px / 40px 26px 46px 34px; box-shadow:5px 6px 0 #2b1d0e; }
  body.samm button.action:nth-child(2) { background:#bdeaff; }
  body.samm button.action:nth-child(3) { background:#c9f5c0; }
  body.samm button.action b { font-size:19px; }
  body.samm :is(label.chip, .stage, .node, .tag) { border:2px solid #2b1d0e; box-shadow:2px 2px 0 #2b1d0e; background:#fff; }
  body.samm .stage { border-radius:12px 18px 10px 16px; }

  /* the herd wanders the meadow behind the panels; JS (herd) moves each cow */
  #herd { display:none; }
  body.samm #herd { display:block; position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  body.samm .wrap { position:relative; z-index:1; }
  .cow { position:absolute; left:0; top:0; width:240px; transform-origin:50% 100%; }
  .cow svg { width:100%; display:block; animation:bob .5s ease-in-out infinite alternate; }
  .cow .tail { transform-origin:36px 64px; animation:wag 1s ease-in-out infinite alternate; }
  .cow .head { transform-origin:150px 66px; animation:nod 2.6s ease-in-out infinite; }
  .cow:nth-child(3) .head { animation-delay:-1s; } .cow:nth-child(4) .head { animation-delay:-1.8s; }
  /* idle: the company logo pops up in a thought bubble and spins once */
  .cow .logo { opacity:0; transform-box:fill-box; transform-origin:30% 100%; }
  .cow .mark { transform-box:fill-box; transform-origin:center; }
  .cow.idle .logo { animation:pop 3.2s ease-out both; }
  .cow.idle .mark { animation:spin 3.2s ease-in-out; }
  .cow.idle svg { animation:hop .4s ease-out 4 alternate; }
  @keyframes pop { 0% { opacity:0; transform:scale(.2); } 12% { opacity:1; transform:scale(1.15); } 20%, 85% { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(.6); } }
  @keyframes spin { 0%, 25% { rotate:0deg; } 75%, 100% { rotate:360deg; } }
  @keyframes hop { to { transform:translateY(-14px); } }
  @keyframes bob { to { transform:translateY(-4px); } }
  @keyframes wag { from { transform:rotate(-12deg); } to { transform:rotate(14deg); } }
  @keyframes nod { 0%, 70%, 100% { transform:rotate(0); } 80% { transform:rotate(9deg); } 90% { transform:rotate(-3deg); } }
  @media (prefers-reduced-motion:reduce) { .cow, .cow * { animation:none !important; } }
  body.samm .dot { width:auto; height:auto; background:none; font-size:14px; }
  body.samm .dot::before { content:"🐄"; }
  body.samm .dot.crashed::before { content:"🥩"; }
  body.samm .dot.done::before { content:"🥛"; }
  body.samm .meter { height:16px; border:2px solid #2b1d0e; background:#fff; }
  body.samm .meter > div { background:repeating-linear-gradient(90deg, #fff 0 10px, #f3f0e6 10px 20px); }
  body.samm .chart rect { fill:#fff; stroke:#2b1d0e; stroke-width:.6; opacity:1; }
  body.samm .stage, body.samm .node, body.samm .tag { border-width:2px; }
  body.samm input:is([type=number], [type=text]), body.samm :is(select, textarea) { background:#fff; color:var(--text); }

  /* blur: hide what PRs and tasks say, keep counts, states and buttons readable */
  body.blurred :is(.pname, li.pr a, li.prop summary, li.prop > span, details p, #plan .item > label > span,
    #questions .item > div, .wrow .title, li.conflict pre, li.conflict span[title]) { filter:blur(5px); }
</style>
</head>

    <path d="M145 47 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0 M163 47 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0 M141 45 L145 46 M181 46 L185 45" fill="none" stroke-width="2.6"/>

  </g>
  <g class="logo"><circle cx="150" cy="12" r="3" fill="#fff" stroke-width="2"/><circle cx="156" cy="0" r="4.5" fill="#fff" stroke-width="2"/>
    <circle cx="163" cy="-24" r="21" fill="#fff"/><g transform="translate(163 -24)"><g class="mark"><path d="M0 0 L15.0 0.0 M0 0 L8.7 5.0 M0 0 L7.5 13.0 M0 0 L0.0 10.0 M0 0 L-7.5 13.0 M0 0 L-8.7 5.0 M0 0 L-15.0 0.0 M0 0 L-8.7 -5.0 M0 0 L-7.5 -13.0 M0 0 L-0.0 -10.0 M0 0 L7.5 -13.0 M0 0 L8.7 -5.0" fill="none" stroke="#d97757" stroke-width="4.5"/></g></g></g>
</svg></div>
</div>
<div class="wrap">
  <header>
    <h1 data-samm="SAMM">Harness</h1>
    <div class="status" id="status"><span class="muted">načítám…</span></div>
    <span class="spacer"></span>
    <button class="small" id="sammToggle" aria-pressed="false" title="Parodický mlékárenský vzhled">🐄 Mlékárna</button>
    <button class="small" id="blurredToggle" aria-pressed="false" title="Rozmazat obsah PR a úkolů">🙈 Rozmazat</button>
    <div id="subtitle">Subscription Automatic Milking Machine — dojíme tokeny 24/7</div>
  </header>

  <div class="col left">
    <section id="flow">
      <div class="actions">
        <button class="action primary" data-act="run" data-path="pick_tasks worker reflect">
          <b>▶ Zpracovat frontu</b><span id="runSub">Implementuje úkoly [ ] z BACKLOGu a otevře PR</span></button>
        <button class="action" data-act="go" data-path="discover prioritize approve pick_tasks worker reflect">
          <b>🔍 Najít a naplánovat</b><span>Opus projde projekty, navrhne úkoly; plán schválíš tady, pak je zpracuje</span></button>
        <button class="action" data-act="go" data-lenses="cleanup" data-path="discover prioritize approve pick_tasks worker reflect">
          <b>🧹 Revize čistoty kódu</b><span>Opus projde celé repo, najde spaghetti a navrhne refaktory; plán schválíš tady</span></button>
      </div>
      <div class="row" id="scope" style="margin-top:10px"></div>
      <div class="row" id="lenses" style="margin-top:6px; font-size:13px"><span class="muted">Hledat:</span>
        <label class="chip"><input type="checkbox" value="fix" checked> Bugy a opravy</label>
        <label class="chip"><input type="checkbox" value="feature" checked> Nové features</label></div>
      <div class="row" id="limits" style="margin-top:6px; font-size:13px"><span class="muted">Tento běh:</span>
        <label class="chip">max úkolů <input type="number" id="maxTasks" min="1"></label>
        <label class="chip">najednou <input type="number" id="maxParallel" min="1"></label></div>
      <div class="pipe" id="pipe"></div>
      <div id="workers"></div>
      <div id="flowHint" class="muted"></div>
    </section>
    <section id="planBox" class="attention" hidden><h2>Plán ke schválení</h2><div id="plan"></div></section>
    <section id="questionBox" class="attention" hidden><h2>Dotazy k úkolům</h2><div id="questions"></div></section>
    <section id="mergeBox" class="attention" hidden><h2>Návrhy ke sloučení</h2><div id="merges"></div></section>
    <div class="projects" id="projects"></div>
  </div>

  <div class="col">
    <section><h2>Kvóta subscription</h2><div id="quota" class="muted">bez dat — žádný běh zatím nenahlásil využití</div></section>
    <section class="chart"><h2>Tokeny po dnech (14 dní)</h2><div id="chart"></div><div id="cost" class="muted"></div></section>
    <section id="lessonsBox" hidden><h2>Lekce z reflexe</h2><div id="lessons"></div></section>
    <section><h2>Historie autorunu</h2><input type="date" id="historyDay"><pre id="history" class="muted"></pre></section>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let serveOn = false, questionIds = "", mergesKey = "", planId = "", projectsKey = "", lessonsKey = "", scopeKey = "", boot = null;
let excluded = new Set();  // unchecked in the project filter; a new project starts checked
try { excluded = new Set(JSON.parse(localStorage.getItem("excluded") || "[]")); } catch (e) {}

function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.add("show");
  setTimeout(() => $("toast").classList.remove("show"), 3500);
}

async function act(action, body = {}) {
  const r = await fetch(`/control/${action}`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  toast(r.ok ? (data.message || "OK") : (data.detail || `chyba ${r.status}`));
  refresh();
}

function scoped() {
  // all checked → no filter, so the daemon's own default (every project) applies
  const boxes = [...$("scope").querySelectorAll("input")];
  return boxes.every(c => c.checked) ? {} : {projects: boxes.filter(c => c.checked).map(c => c.value)};
}

function limits() {
  // empty field → the daemon's projects.yaml value applies
  const out = {};
  for (const [key, id] of [["max_tasks", "maxTasks"], ["max_parallel", "maxParallel"]])
    if ($(id).value !== "") out[key] = Number($(id).value);
  return out;
}

function renderLimits(defaults) {
  // fill once; later refreshes must not overwrite what the owner typed
  if (!defaults) return;
  if ($("maxTasks").value === "") $("maxTasks").value = defaults.max_tasks;
  if ($("maxParallel").value === "") $("maxParallel").value = defaults.max_parallel;
}

function runBody(button) {
  // the cleanup button carries its own lens; both checkboxes checked → no filter; only "go" discovers
  const boxes = [...$("lenses").querySelectorAll("input")];
  const body = {...scoped(), ...limits()};
  if (button.dataset.lenses) return {...body, lenses: button.dataset.lenses.split(" ")};
  return button.dataset.act === "go" && !boxes.every(c => c.checked)
    ? {...body, lenses: boxes.filter(c => c.checked).map(c => c.value)} : body;
}

function renderScope(projects) {
  const names = projects.map(p => p.name), key = names.join();
  if (key === scopeKey) return;
  scopeKey = key;
  $("scope").innerHTML = `<span class="muted">Projekty:</span>` + names.map(n => `<label class="chip">
      <input type="checkbox" value="${esc(n)}" ${excluded.has(n) ? "" : "checked"}> <span class="pname">${esc(n)}</span></label>`).join("");
  $("scope").querySelectorAll("input").forEach(c => c.onchange = () => {
    c.checked ? excluded.delete(c.value) : excluded.add(c.value);
    try { localStorage.setItem("excluded", JSON.stringify([...excluded])); } catch (e) {}
    renderRunSub(projects);
  });
}

async function mergePr(button) {
  // two clicks instead of confirm(): a modal dialog would freeze the wallpaper (Lively)
  if (button.dataset.armed !== "1") {
    button.dataset.armed = "1";
    button.textContent = "Opravdu?";
    setTimeout(() => { button.dataset.armed = ""; button.textContent = "Merge"; }, 4000);
    return;
  }
  button.disabled = true;
  button.textContent = "merguju…";
  const r = await fetch("/prs/merge", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({project: button.dataset.project, number: +button.dataset.number})});
  const data = await r.json().catch(() => ({}));
  toast(r.ok ? data.message : (data.detail || `chyba ${r.status}`));
  projectsKey = "";
  refresh();
}

function conflictBox(project, pr) {
  const c = pr.conflict;
  if (!c || c.state === "kept") return "";
  const files = `<b>Konflikt</b> v <span title="${esc(c.files.join("\n"))}">${c.files.map(f => esc(f.split("/").pop())).join(", ")}</span>`;
  if (c.state === "resolving") return `<li class="conflict">${files} · <span class="muted">🤖 agent řeší konflikt a pouští testy…</span></li>`;
  const data = `data-project="${esc(project)}" data-number="${pr.number}"`;
  return `<li class="conflict">${files}${c.state === "failed" ? ` · agent neuspěl:<pre>${esc(c.error)}</pre>` : ""}
    <div class="row"><button class="primary" data-conflict="agent" ${data}
      title="Merge main do větve, agent vyřeší konflikty, push jen když projde verify">Vyřešit agentem</button>
    <button data-conflict="reimplement" ${data} title="Zavře PR, smaže větev a vrátí úkol do fronty">Přeimplementovat</button>
    <button data-conflict="keep" ${data} title="Skrýt; PR zůstane s konfliktem">Nechat</button></div></li>`;
}

async function settleConflict(button) {
  const action = button.dataset.conflict;
  if (action === "reimplement" && button.dataset.armed !== "1") {  // closes the PR: two clicks, as for Merge
    button.dataset.armed = "1";
    button.textContent = "Opravdu?";
    setTimeout(() => { button.dataset.armed = ""; button.textContent = "Přeimplementovat"; }, 4000);
    return;
  }
  button.disabled = true;
  const r = await fetch("/prs/conflict", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({project: button.dataset.project, number: +button.dataset.number, action})});
  const data = await r.json().catch(() => ({}));
  toast(r.ok ? data.message : (data.detail || `chyba ${r.status}`));
  projectsKey = "";
  refresh();
}

function ciTag(pr) {
  const label = {ok: "CI ✓", fail: "CI ✗", pending: "CI …"}[pr.ci];
  const conflict = pr.mergeable === "CONFLICTING" ? `<span class="tag fail">konflikt</span>` : "";
  return (label ? `<span class="tag ${pr.ci}">${label}</span>` : "") + conflict;
}

function age(iso) {
  const h = (Date.now() - new Date(iso)) / 36e5;
  return h < 24 ? `${Math.max(1, Math.round(h))} h` : `${Math.round(h / 24)} d`;
}

const ACTIVE = ["running", "waiting", "approving", "paused"];
const RUN_STATUS = {running: "běží", waiting: "čeká na tvou odpověď", approving: "čeká na schválení plánu",
  paused: "pauza kvůli limitu", done: "hotovo", crashed: "spadl", interrupted: "přerušen"};
const STAGES = [["discover", "Hledání", "Opus prochází projekty"], ["prioritize", "Prioritizace", "seřadí návrhy do plánu"],
  ["approve", "Schválení", "čeká na tebe"], ["pick_tasks", "Výběr", "vezme úkoly z fronty"],
  ["worker", "Práce", "paralelně na úkolech"], ["reflect", "Reflexe", "navrhne lekce"]];
const NODES = [["preflight", "kontrola"], ["make_worktree", "worktree"], ["plan", "plán"], ["clarify", "dotaz"],
  ["setup", "setup"], ["implement", "implementace"], ["verify", "testy"], ["replan", "replan"], ["open_pr", "PR"], ["report", "zápis"]];
const OUTCOME = {pr_opened: "PR otevřen", failed: "selhalo", needs_clarification: "nejasné"};
let runActive = false;
let agentResolving = false;

function renderStatus(s) {
  serveOn = !!s;
  runActive = !!(s && s.run && ACTIVE.includes(s.run.status));
  document.querySelectorAll("button.action").forEach(b => {
    b.disabled = !serveOn || runActive;
    b.title = !serveOn ? "serve neběží" : runActive ? "běh už probíhá — počkej, až doběhne" : "";
  });
  if (!s) { $("status").innerHTML = `<span class="muted">serve neběží — tlačítka jsou vypnutá</span>`; return; }
  const run = s.run;
  $("status").innerHTML = `<span class="dot ${run ? run.status : ""}"></span>
    <span>${run ? `${esc(run.id)} — <b>${esc(RUN_STATUS[run.status] || run.status)}</b>` : "žádný běh"}</span>
    <span class="muted" title="${esc(s.limits.join("\n"))}">· autorun: <b>${s.paused ? "vypnutý" : "zapnutý"}</b></span>
    <button class="small" id="auto" title="Automatické spouštění fronty, návrhů a cleanup review v limitech projektu. Běžící běh nezastaví, ruční tlačítka fungují vždy.">${s.paused ? "Zapnout" : "Vypnout"}</button>`;
  $("auto").onclick = () => act(s.paused ? "resume" : "pause");
}

function stageState(name, p, run) {
  const st = p.stages[name];
  if (name === "approve" && run.status === "approving") return "wait";
  if (st === "active" && run.status === "paused") return "wait";
  if (st === "active" && run.status === "crashed") return "error";
  return st || "";
}

function nodeState(w, node, run) {
  const st = w.nodes[node];
  if (node === "clarify" && w.last === "clarify" && run.status === "waiting") return "wait";
  if (st === "active" && run.status === "paused") return "wait";
  return st || "";
}

function renderFlow(p, run) {
  $("pipe").innerHTML = STAGES.map(([name, label, sub]) => {
    const extra = name === "discover" && Object.keys(p.discover).length
      ? Object.entries(p.discover).map(([proj, st]) => `<span class="pname">${esc(proj)}</span> ${st === "done" ? "✓" : "…"}`).join(" · ") : sub;
    return `<div class="stage ${stageState(name, p, run)}" data-stage="${name}">${label}<small>${extra}</small></div>`;
  }).join(`<span class="arrow">→</span>`);
  $("workers").innerHTML = p.workers.map(w => `<div class="wrow">
      <span class="title"><b>${esc(w.id)}</b> ${esc(w.title)}</span>
      ${NODES.filter(([n]) => !["clarify", "replan"].includes(n) || w.nodes[n]).map(([n, label]) =>
        `<span class="node ${nodeState(w, n, run)}">${label}${n === "implement" && w.attempts > 1 ? ` ×${w.attempts}` : ""}</span>`).join("")}
      ${w.outcome && w.nodes.report === "done" ? (w.pr_url ? `<a href="${esc(w.pr_url)}" target="_blank" rel="noopener">${OUTCOME[w.outcome] || esc(w.outcome)}</a>`
        : `<span class="tag ${w.outcome === "pr_opened" ? "ok" : "fail"}">${OUTCOME[w.outcome] || esc(w.outcome)}</span>`) : ""}</div>`).join("");
  $("flowHint").textContent = run.id ? `${run.id}: ${RUN_STATUS[run.status] || run.status}` : "Zatím žádný běh. Najeď na tlačítko a uvidíš, kudy půjde.";
  hint = $("flowHint").textContent;
  if ($("flow").dataset.preview && hovered) preview(hovered);  // a refresh under the mouse keeps the preview
}

let hint = "", hovered = null;
async function refreshFlow(run) {
  if (!run) return renderFlow({stages: {}, discover: {}, workers: []}, {});
  try { renderFlow(await (await fetch(`/runs/${encodeURIComponent(run.id)}/progress`)).json(), run); } catch (e) {}
}

function preview(button) {
  const path = button.dataset.path.split(" ");
  hovered = button;
  $("flow").dataset.preview = button.dataset.act;
  $("pipe").querySelectorAll(".stage").forEach(el => el.classList.toggle("on-preview", path.includes(el.dataset.stage)));
  $("flowHint").textContent = button.dataset.act === "run"
    ? "Vezme úkoly [ ] z vybraných projektů podle priority, pro každý: worktree → plán → implementace → testy → PR. Nakonec reflexe."
    : button.dataset.lenses
    ? "Opus zreviduje celé repo vybraných projektů (zamotaný kód, duplicity, mrtvý kód) a navrhne refaktory bez změny chování. Plán schválíš, pak z nich udělá PR."
    : "Opus projde vybrané projekty a navrhne úkoly, seřadí je a počká, až plán schválíš. Schválené pak zpracuje jako frontu.";
}

function unpreview() {
  hovered = null;
  delete $("flow").dataset.preview;
  $("flowHint").textContent = hint;
}

function renderRunSub(projects) {
  const picked = new Set(Object.keys(scoped()).length ? scoped().projects : projects.map(p => p.name));
  const n = projects.filter(p => picked.has(p.name)).reduce((a, p) => a + p.counts[" "], 0);
  $("runSub").textContent = `${n} ${n === 1 ? "úkol" : n >= 2 && n <= 4 ? "úkoly" : "úkolů"} ve frontě → implementace a PR`;
}

function renderPlan(plan) {
  $("planBox").hidden = !plan;
  if (!plan || plan.id === planId) return;
  planId = plan.id;
  $("plan").innerHTML = plan.plan.map((p, i) => `<div class="item"><label class="plan">
      <input type="checkbox" checked value="${i}"> <span><b>[${esc(p.project)}]</b> ${esc(p.title)}
      <span class="tag">${p.source === "new" ? "nový" : "z BACKLOGu"}</span>${p.kind ? ` <span class="tag">${esc(p.kind)}</span>` : ""}
      ${p.why ? `<br><span class="muted">${esc(p.why)}</span>` : ""}</span></label></div>`).join("")
    + `<div class="row"><button class="primary" id="planOk">Schválit vybrané</button><button id="planQuit">Ukončit běh</button></div>`;
  $("planOk").onclick = () => act("plan", {keep: [...$("plan").querySelectorAll("input:checked")].map(c => +c.value)});
  $("planQuit").onclick = () => act("plan", {keep: "q"});
}

function renderQuestions(qs) {
  const open = qs.filter(q => !q.answered);
  $("questionBox").hidden = !open.length;
  const ids = open.map(q => q.id).join();
  if (ids === questionIds) return;  // don't wipe what the owner is typing
  questionIds = ids;
  $("questions").innerHTML = open.map(q => `<div class="item" data-id="${esc(q.id)}">
      <div><b>[${esc(q.project)}] ${esc(q.task)}</b> ${esc(q.title)}</div><div>${esc(q.question)}</div>
      <form class="row"><input type="text" aria-label="Odpověď" required><button class="primary">Odeslat</button>
      <button type="button" class="skip">Přeskočit</button></form></div>`).join("");
  $("questions").querySelectorAll(".item").forEach(el => {
    const id = el.dataset.id;
    el.querySelector("form").onsubmit = e => { e.preventDefault(); act("answer", {id, text: el.querySelector("input").value}); };
    el.querySelector(".skip").onclick = () => act("answer", {id, text: ""});
  });
}

function proposalList(props) {
  const of = kinds => props.filter(t => kinds.includes(t.kind));
  const fixes = props.filter(t => !["feature", "refactor"].includes(t.kind));
  return proposalGroup("Návrhy: nové features", of(["feature"])) + proposalGroup("Návrhy: bugy a opravy", fixes)
    + proposalGroup("Návrhy: úklid kódu", of(["refactor"]));
}

function proposalGroup(heading, props) {
  if (!props.length) return "";
  return `<h4>${heading}</h4><ul>${props.map(t => `<li class="prop">
      <details><summary title="${esc(t.title)}"><span class="muted">P${t.priority}</span>
        ${t.kind && !["feature", "refactor"].includes(t.kind) ? `<span class="tag">${esc(t.kind)}</span>` : ""} ${esc(t.title)}</summary>
      ${t.description ? `<p>${esc(t.description)}</p>` : ""}</details>
      <button data-task="${esc(t.id)}" data-do="approve" title="Schválit → fronta" aria-label="Schválit" ${serveOn ? "" : "disabled"}>✅</button>
      <button data-task="${esc(t.id)}" data-do="edit" title="Upravit" aria-label="Upravit" ${serveOn ? "" : "disabled"}>✏️</button>
      <button data-task="${esc(t.id)}" data-do="reject" title="Zamítnout" aria-label="Zamítnout" ${serveOn ? "" : "disabled"}>❌</button></li>`).join("")}</ul>`;
}

function cleanupInfo(c) {
  if (!c) return `<span class="muted" title="Revize čistoty kódu zatím neproběhla">🧹 bez revize</span>`;
  const days = Math.floor((Date.now() / 1000 - c.ts) / 86400);
  const prs = c.prs === null ? "? PR" : `<b>${c.prs}</b> PR`;
  return `<span title="Poslední revize čistoty kódu ${new Date(c.ts * 1000).toLocaleDateString("cs")}; PR = zmergované od té doby">
    🧹 <b>${days}</b> ${days === 1 ? "den" : days >= 2 && days <= 4 ? "dny" : "dní"} · ${prs} od revize</span>`;
}

function renderProjects(projects, proposals) {
  agentResolving = projects.some(p => (p.prs || []).some(pr => pr.conflict && pr.conflict.state === "resolving"));
  const key = JSON.stringify([projects, proposals, serveOn]);
  if (key === projectsKey) return;  // keep opened descriptions open between refreshes
  projectsKey = key;
  $("projects").innerHTML = projects.map(p => {
    const c = p.counts;
    const prs = p.prs === null ? `<span class="muted">PR nejdou načíst (gh)</span>`
      : p.prs.length ? `<ul>${p.prs.map(pr => `<li class="pr"><span class="muted">#${pr.number}</span>
          <a href="${esc(pr.url)}" target="_blank" rel="noopener" title="${esc(pr.title)}">${esc(pr.title.replace(/^\[harness\]\s*/, ""))}</a>
          ${pr.isDraft ? `<span class="tag draft">draft</span>` : ""}${ciTag(pr)}<span class="muted">${age(pr.createdAt)}</span>
          <button data-merge data-project="${esc(p.name)}" data-number="${pr.number}"
            title="Squash merge (draft se nejdřív označí ready), pak smaže větev a worktree">Merge</button></li>
          ${conflictBox(p.name, pr)}`).join("")}</ul>`
      : `<span class="muted">žádné otevřené PR</span>`;
    return `<section><h3 class="pname">${esc(p.name)}</h3>
      <div class="counts"><span><b>${c[" "]}</b> ve frontě</span><span><b>${c["~"]}</b> návrhů</span>
        <span><b>${c["x"]}</b> hotovo</span>${c["?"] ? `<span style="color:var(--warn)"><b>${c["?"]}</b> nejasné</span>` : ""}
        ${cleanupInfo(p.cleanup)}
        ${p.plan ? `<span title="ROADMAP.md: podle něj scout navrhuje features">📘 plán</span>` : `<span class="muted" title="Bez ROADMAP.md navrhuje scout features bez směru">📘 bez plánu</span>`}
        <button class="small" data-plan-cc="${esc(p.name)}" title="Otevře Claude Code ve Windows Terminalu v adresáři projektu">${p.plan ? "Upravit plán v CC" : "Vytvořit plán v CC"}</button></div>
      ${p.plan ? `<details data-plan="${esc(p.name)}"><summary>Projektový plán</summary><pre class="plan">načítám…</pre></details>` : ""}
      ${prs}${proposalList(proposals.filter(t => t.project === p.name))}
      <details><summary>+ úkol</summary>
        <form data-add="${esc(p.name)}" class="row" style="flex-wrap:wrap">
          <input type="text" name="title" required placeholder="titulek" aria-label="Titulek úkolu">
          <select name="priority" aria-label="Priorita"><option value="1">P1</option><option value="2" selected>P2</option><option value="3">P3</option></select>
          <textarea name="description" rows="2" placeholder="popis" aria-label="Popis" style="flex-basis:100%"></textarea>
          <input type="text" name="done" placeholder="Hotovo = …" aria-label="Hotovo =" style="flex-basis:100%">
          <button class="primary" ${serveOn ? "" : "disabled"}>Přidat</button></form></details></section>`;
  }).join("");
  $("projects").querySelectorAll("[data-add]").forEach(f => f.onsubmit = e => {
    e.preventDefault();
    const v = f.elements;
    act("add", {project: f.dataset.add, title: v.title.value, description: v.description.value, done: v.done.value, priority: +v.priority.value});
  });
  $("projects").querySelectorAll("[data-merge]").forEach(b => b.onclick = () => mergePr(b));
  $("projects").querySelectorAll("[data-plan-cc]").forEach(b => b.onclick = () => planSession(b.dataset.planCc));
  $("projects").querySelectorAll("details[data-plan]").forEach(d => d.ontoggle = () => loadPlan(d));
  $("projects").querySelectorAll("[data-conflict]").forEach(b => b.onclick = () => settleConflict(b));
  $("projects").querySelectorAll("[data-do=approve]").forEach(b => b.onclick = () => act("approve", {task: b.dataset.task}));
  $("projects").querySelectorAll("[data-do=reject]").forEach(b => b.onclick = () => askReason(b));
  $("projects").querySelectorAll("[data-do=edit]").forEach(b => b.onclick = () => editProposal(b, proposals.find(t => t.id === b.dataset.task)));
}

function editProposal(button, t) {
  if (!t) return;
  const rows = t.description ? t.description.split("\n") : [];
  const done = (rows.find(r => r.startsWith("Hotovo = ")) || "").slice(9);
  const text = rows.filter(r => !r.startsWith("Hotovo = ") && !r.startsWith("ACCEPT:")).join("\n");
  const li = button.closest("li");
  li.innerHTML = `<form class="row" style="flex:1;flex-wrap:wrap">
      <input type="text" name="title" required value="${esc(t.title)}" aria-label="Titulek úkolu">
      <select name="priority" aria-label="Priorita">${[1, 2, 3].map(p => `<option value="${p}"${p === t.priority ? " selected" : ""}>P${p}</option>`).join("")}</select>
      <textarea name="description" rows="3" aria-label="Popis" style="flex-basis:100%">${esc(text)}</textarea>
      <input type="text" name="done" value="${esc(done)}" placeholder="Hotovo = …" aria-label="Hotovo =" style="flex-basis:100%">
      <button class="primary" value="0">Uložit</button><button class="primary" value="1">Uložit a schválit</button>
      <button type="button">Zpět</button></form>`;
  const f = li.querySelector("form");
  f.onsubmit = e => {
    e.preventDefault();
    const v = f.elements;
    act("edit", {task: t.id, title: v.title.value, description: v.description.value, done: v.done.value,
      priority: +v.priority.value, approve: e.submitter.value === "1"});
  };
  li.querySelector("button[type=button]").onclick = () => { projectsKey = ""; refresh(); };
}

function askReason(button) {
  // optional reason: the reflection learns from it (phase 5)
  const li = button.closest("li");
  li.innerHTML = `<form class="row" style="flex:1"><input type="text" aria-label="Proč zamítnout (nepovinné)"
      placeholder="proč? (nepovinné)"><button class="primary">Zamítnout</button><button type="button">Zpět</button></form>`;
  const input = li.querySelector("input");
  input.focus();
  li.querySelector("form").onsubmit = e => { e.preventDefault(); act("reject", {task: button.dataset.task, reason: input.value}); };
  li.querySelector("button[type=button]").onclick = () => { projectsKey = ""; refresh(); };
}

function renderLessons(list) {
  const key = JSON.stringify([list, serveOn]);
  if (key === lessonsKey) return;
  lessonsKey = key;
  const proposed = list.filter(l => l.status === "proposed"), active = list.filter(l => l.status === "active");
  $("lessonsBox").hidden = !list.length;
  const row = (l, buttons) => `<li class="prop"><span class="tag">${esc(l.project)}</span>
      <span style="flex:1;min-width:0">${esc(l.text)}</span>${buttons(l)}</li>`;
  const btn = (l, approve, label, title) => `<button data-lesson="${esc(l.id)}" data-project="${esc(l.project)}"
      data-approve="${approve}" title="${title}" aria-label="${title}" ${serveOn ? "" : "disabled"}>${label}</button>`;
  $("lessons").innerHTML = (proposed.length ? `<h4>Ke schválení</h4><ul>${proposed.map(l =>
        row(l, l => btn(l, 1, "✅", "Platí") + btn(l, 0, "❌", "Zahodit"))).join("")}</ul>` : "")
    + (active.length ? `<details><summary>Aktivní lekce (${active.length})</summary><ul>${active.map(l =>
        row(l, l => btn(l, 0, "vyřadit", "Vyřadit"))).join("")}</ul></details>` : "");
  $("lessons").querySelectorAll("[data-lesson]").forEach(b => b.onclick = () =>
    act("lesson", {project: b.dataset.project, id: b.dataset.lesson, approve: b.dataset.approve === "1"}));
}

function renderUsage(u) {
  const rl = u.rate_limit;
  if (rl) {
    const pct = rl.utilization == null ? null : Math.round(rl.utilization * 100);
    const source = rl.status === "live" ? "živě" : "z posledního běhu";
    $("quota").classList.remove("muted");
    // the live endpoint can fail; the SDK fallback reports utilization only near the limit (allowed_warning)
    $("quota").innerHTML = (pct == null ? `<div class="big">${rl.status === "rejected" ? "vyčerpáno" : "OK"}</div><div class="muted">pod hranicí varování, přesné % SDK nehlásí</div>` :
      `<div class="big">${pct} %</div>${meter(pct)}`) + quotaMeta("5h okno", rl, source)
      + (u.seven_day ? `<div style="margin-top:8px">${meter(Math.round(u.seven_day.utilization * 100))}</div>${quotaMeta(`7 dní ${Math.round(u.seven_day.utilization * 100)} %`, u.seven_day, source)}` : "");
  }
  const days = [];
  for (let i = 13; i >= 0; i--) days.push(new Date(Date.now() - i * 864e5).toLocaleDateString("sv-SE"));
  const per = Object.fromEntries(days.map(d => [d, {tokens: 0, cost: 0, paid: 0}]));
  for (const r of u.summary) if (!r.simulated && per[r.day]) {
    per[r.day].tokens += r.input_tokens + r.output_tokens + r.cache_tokens;
    per[r.day].cost += r.cost_usd;
    per[r.day].paid += r.paid_usd ?? 0;
  }
  const max = Math.max(1, ...days.map(d => per[d].tokens)), w = 100 / days.length;
  $("chart").innerHTML = `<svg viewBox="0 0 100 70" preserveAspectRatio="none" role="img" aria-label="Tokeny po dnech">
    ${days.map((d, i) => { const h = per[d].tokens / max * 58;
      return `<rect x="${i * w + w * .15}" y="${60 - h}" width="${w * .7}" height="${h}"><title>${d}: ${per[d].tokens.toLocaleString("cs-CZ")} tokenů, ${costLabel(per[d].cost, per[d].paid)}</title></rect>`; }).join("")}
    </svg><div class="row muted" style="justify-content:space-between;font-size:12px"><span>${days[0].slice(5)}</span><span>dnes</span></div>`;
  const sum = k => days.reduce((a, d) => a + per[d][k], 0), today = per[days[13]];
  $("cost").textContent = `dnes ${today.tokens.toLocaleString("cs-CZ")} tokenů · 14 dní ${costLabel(sum("cost"), sum("paid"))}`;
}

const meter = pct => `<div class="meter ${pct >= 70 ? "high" : ""}"><div style="width:${Math.min(pct, 100)}%"></div></div>`;

function quotaMeta(label, w, source) {
  const reset = w.resets_at ? new Date(w.resets_at * 1000).toLocaleString("cs-CZ", {weekday: "short", hour: "2-digit", minute: "2-digit"}) : "?";
  return `<span class="muted">${esc(label)} · reset ${esc(reset)} · ${esc(source)}</span>`;
}

// subscription cost is only the SDK's list-price estimate; API cost was really paid — never one number
function costLabel(cost, paid) {
  const est = cost - paid, parts = [];
  if (est.toFixed(2) !== "0.00") parts.push(`≈$${est.toFixed(2)} odhad (subscription)`);
  if (paid.toFixed(2) !== "0.00") parts.push(`$${paid.toFixed(2)} zaplaceno (API)`);
  return parts.join(" + ") || "$0.00";
}

function renderMerges(list) {
  $("mergeBox").hidden = !list.length;
  const key = JSON.stringify(list.map(m => m.id));
  if (key === mergesKey) return;  // keep an opened description open
  mergesKey = key;
  $("merges").innerHTML = list.map(m => `<div class="item">
      <div><b>[${esc(m.project)}]</b> ${m.titles.map(esc).join(" + ")}</div>
      <details><summary>→ ${esc(m.title)}</summary>${m.why ? `<p class="muted">${esc(m.why)}</p>` : ""}
        <p>${esc(m.description)}</p>${m.done ? `<p>Hotovo = ${esc(m.done)}</p>` : ""}</details>
      <div class="row"><button class="primary" data-merge-id="${esc(m.id)}" data-accept="1" title="Nový návrh místo původních, ty se označí jako sloučené">Sloučit</button>
        <button data-merge-id="${esc(m.id)}" title="Nechat návrhy zvlášť, tahle skupina se už nenabídne">Ignorovat</button></div></div>`).join("");
  $("merges").querySelectorAll("[data-merge-id]").forEach(b => b.onclick = () => act("merge", {id: b.dataset.mergeId, accept: !!b.dataset.accept}));
}

async function planSession(name) {
  const r = await fetch(`/projects/${encodeURIComponent(name)}/plan/session`, {method: "POST"});
  const data = await r.json().catch(() => ({}));
  toast(r.ok ? data.message : (data.detail || `chyba ${r.status}`));
}

async function loadPlan(d) {
  if (!d.open || d.dataset.loaded) return;
  const r = await fetch(`/projects/${encodeURIComponent(d.dataset.plan)}/plan`);
  d.querySelector("pre").textContent = r.ok ? (await r.json()).text : "plán nejde načíst";
  d.dataset.loaded = "1";
}

async function refresh() {
  try {
    const o = await (await fetch("/overview")).json();
    if (boot !== null && o.boot !== boot) return location.reload();  // serve restarted: load the new page
    boot = o.boot;
    renderStatus(o.serve);
    renderPlan(o.serve && o.serve.plan);
    renderQuestions(o.serve ? o.serve.questions : []);
    renderMerges(o.serve ? o.serve.merges : []);
    renderScope(o.projects);
    renderLimits(o.limits);
    renderRunSub(o.projects);
    refreshFlow(o.serve && o.serve.run);
    renderProjects(o.projects, o.proposals);
    renderLessons(o.serve ? o.serve.lessons : []);
  } catch (e) { $("status").innerHTML = `<span style="color:var(--bad)">dashboard nedostupný</span>`; }
}
async function refreshUsage() {
  try { renderUsage(await (await fetch("/usage")).json()); } catch (e) {}
}

async function loadHistory() {
  try { $("history").textContent = (await (await fetch(`/history?day=${$("historyDay").value}`)).json()).text; }
  catch (e) { $("history").textContent = "historie nedostupná"; }
}
$("historyDay").value = new Date().toLocaleDateString("sv");  // sv locale = YYYY-MM-DD in local time
$("historyDay").onchange = loadHistory;
loadHistory();

function setMode(cls, on) {
  // parody skin and blur are per-viewer looks: body class + localStorage, no server state
  document.body.classList.toggle(cls, on);
  $(cls + "Toggle").setAttribute("aria-pressed", on);
  try { localStorage.setItem(cls, on ? "1" : ""); } catch (e) {}
  if (cls === "samm") document.querySelectorAll("[data-samm]").forEach(el => {
    el.dataset.orig ??= el.textContent;
    el.textContent = on ? el.dataset.samm : el.dataset.orig;
  });
}

for (const cls of ["samm", "blurred"]) {
  let on = false;
  try { on = localStorage.getItem(cls) === "1"; } catch (e) {}
  setMode(cls, on);
  $(cls + "Toggle").onclick = () => setMode(cls, !document.body.classList.contains(cls));
}

// each cow walks to a random spot on the meadow (lower 45 % of the screen), grazes a while, picks another;
// depth: higher up = farther = smaller and behind
function herd() {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const spot = c => Object.assign(c, {tx: Math.random() * (innerWidth - 180), ty: Math.random(), wait: Math.random() * 4});
  const cows = [...document.querySelectorAll(".cow")].map(el => {
    const c = spot({el, dir: 1});  // start somewhere random, then head somewhere else
    return spot(Object.assign(c, {x: c.tx, y: c.ty}));
  });
  let last = performance.now();
  requestAnimationFrame(function step(now) {
    const dt = Math.min(now - last, 100) / 1000;
    last = now;
    if (document.body.classList.contains("samm")) for (const c of cows) walk(c, dt, still, spot);
    requestAnimationFrame(step);
  });
}

function walk(c, dt, still, spot) {
  const top = innerHeight * .55, depth = innerHeight * .45 - 40;
  if (!still) {
    if (c.wait > 0) c.wait -= dt;
    else {
      const dx = c.tx - c.x, dy = (c.ty - c.y) * depth, d = Math.hypot(dx, dy), v = 45 * dt;
      if (d < v) { spot(c); if (Math.random() < .4) idle(c); }
      else { c.x += dx / d * v; c.y += dy / d * v / depth; if (Math.abs(dx) > 2) c.dir = Math.sign(dx); }
    }
  }
  const s = .5 + .5 * c.y, feet = top + 20 + c.y * depth;
  c.el.style.zIndex = Math.round(c.y * 100);
  c.el.style.transform = `translate(${c.x}px, ${feet - c.el.offsetHeight}px) scale(${c.dir * s}, ${s})`;
}

function idle(c) {
  // stand still while the logo bubble plays (.idle animations last 3.2 s)
  c.wait = Math.max(c.wait, 3.4);
  c.el.classList.add("idle");
  setTimeout(() => c.el.classList.remove("idle"), 3300);
}
herd();

document.querySelectorAll("button.action").forEach(b => {
  b.onclick = () => act(b.dataset.act, runBody(b));
  b.onmouseenter = b.onfocus = () => preview(b);
  b.onmouseleave = b.onblur = unpreview;
});
refresh(); refreshUsage();
let ticks = 0;
setInterval(() => { if (runActive || agentResolving || ++ticks % 5 === 0) refresh(); }, 3000);  // live while a run or conflict agent is active
setInterval(refreshUsage, 60000);

// drag-to-scroll: Lively may not forward the wheel; a drag past 5px scrolls the column and swallows the click
const NO_DRAG = "button, a, input, select, textarea, label, summary, pre";
for (const col of document.querySelectorAll(".wrap > .col")) {
  let startY = null, startTop = 0, dragged = false;
  col.addEventListener("pointerdown", e => {
    dragged = false;
    if (e.button !== 0 || e.target.closest(NO_DRAG) || col.scrollHeight <= col.clientHeight) return;
    startY = e.clientY; startTop = col.scrollTop;
  });
  col.addEventListener("pointermove", e => {
    if (startY === null) return;
    if (!dragged && Math.abs(e.clientY - startY) < 5) return;
    if (!dragged) { dragged = true; col.classList.add("dragging"); try { col.setPointerCapture(e.pointerId); } catch (_) {} }  // throws on Lively's forwarded (button-less) moves
    col.scrollTop = startTop - (e.clientY - startY);
  });
  const end = () => { startY = null; col.classList.remove("dragging"); };
  col.addEventListener("pointerup", end);
  col.addEventListener("pointercancel", end);
  col.addEventListener("click", e => { if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);
}
</script>
