<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Desktop</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0e0f13; --panel:rgba(27,28,34,.86); --text:#ececf1; --muted:#9a9aa6; --line:#2c2d35; --accent:#8c98ff;
          --ok:#4cc38a; --bad:#ff6b5e; --warn:#f0b75a; --on-accent:#111114; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font:16px/1.45 system-ui, sans-serif; color:var(--text); background:var(--bg); }
  /* left gutter for desktop icons, bottom for the taskbar */
  .wrap { padding:20px 32px 64px 140px; display:grid; gap:14px; grid-template-rows:auto auto auto minmax(0,1fr); }
  .cols { display:grid; gap:14px; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,.7fr); align-items:start; min-height:0; }
  .col { display:grid; gap:12px; min-width:0; align-content:start; }
  /* the wallpaper (Lively) may get no mouse wheel: each column scrolls by its scrollbar or by dragging the content */
  @media (min-width:1101px) {
    .wrap { height:100vh; }
    .cols > .col { max-height:100%; overflow-y:auto; padding-right:6px; scrollbar-color:var(--muted) transparent; }
    .cols > .col.dragging { cursor:grabbing; user-select:none; }
  }
  @media (max-width:1100px) { .wrap { padding:16px; } .cols { grid-template-columns:1fr; } }
  h1 { font-size:26px; font-weight:700; margin:0 12px 0 0; letter-spacing:-.01em; }
  h2 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  h2 .count { color:var(--text); font-size:16px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; backdrop-filter:blur(6px); min-width:0; }
  button { font:inherit; padding:6px 12px; border-radius:7px; border:1px solid var(--line); background:#22232b; color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  button.small { padding:2px 9px; font-size:13px; }
  button:disabled { opacity:.45; cursor:default; }
  input[type=number] { font:inherit; width:4em; padding:1px 4px; border-radius:5px; border:1px solid var(--line); background:#15161b; color:var(--text); }
  input[type=text], input[type=date], select, textarea { font:inherit; padding:6px 10px; border-radius:7px; border:1px solid var(--line); background:#15161b; color:var(--text); }
  input[type=text] { flex:1 1 220px; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .muted { color:var(--muted); }
  .spacer { flex:1; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  ul { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:minmax(0,1fr); gap:6px; }
  details summary { cursor:pointer; color:var(--muted); font-size:14px; }
  details p { margin:6px 0 0; font-size:14px; white-space:pre-wrap; }
  pre.plan { white-space:pre-wrap; max-height:24em; overflow:auto; font-size:13px; margin:4px 0; }

  /* header: run status, autorun, quota */
  .top { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .status { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); display:inline-block; }
  .dot.running { background:var(--accent); } .dot.waiting, .dot.approving, .dot.paused { background:var(--warn); }
  .dot.crashed { background:var(--bad); } .dot.done { background:var(--ok); }
  .why { position:relative; } .why summary { display:inline; }
  .pop { position:absolute; z-index:5; top:calc(100% + 6px); left:0; min-width:260px; background:#1b1c22; border:1px solid var(--line); border-radius:10px;
         padding:10px 12px; display:grid; gap:8px; font-size:14px; white-space:pre-wrap; }
  .quota { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .qchip { display:inline-flex; gap:8px; align-items:center; font-size:14px; }
  .qchip .meter { width:110px; margin:0; }
  .meter { height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin:6px 0; }
  .meter > div { height:100%; background:var(--accent); }
  .meter.high > div { background:var(--warn); }

  /* actions + run options */
  .bar { display:flex; gap:12px; align-items:stretch; flex-wrap:wrap; }
  button.action { display:grid; gap:2px; text-align:left; padding:8px 16px; border-radius:10px; border-width:2px; }
  button.action b { font-size:16px; }
  button.action span { font-size:13px; color:var(--muted); }
  button.action.primary span { color:inherit; opacity:.75; }
  .opts { position:relative; align-self:center; }
  .opts .pop { min-width:300px; }
  label.chip { display:inline-flex; gap:5px; align-items:center; padding:3px 10px; border:1px solid var(--line); border-radius:99px; cursor:pointer; }
  label.chip:has(input:checked) { border-color:var(--accent); }

  /* run strip: pipeline + workers */
  #flow { padding:10px 14px; }
  .pipe { display:flex; gap:6px; align-items:stretch; flex-wrap:wrap; }
  .stage { flex:1 1 100px; border:1px solid var(--line); border-radius:8px; padding:4px 9px; font-size:14px; transition:opacity .15s; }
  .stage small { display:block; color:var(--muted); font-size:12px; }
  .arrow { align-self:center; color:var(--muted); }
  :is(.stage, .node).done { border-color:var(--ok); }
  :is(.stage, .node).active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  :is(.stage, .node).wait { border-color:var(--warn); box-shadow:0 0 0 1px var(--warn); }
  :is(.stage, .node).error { border-color:var(--bad); }
  :is(.stage, .node):is(.active, .wait)::before { content:"● "; color:var(--accent); }
  :is(.stage, .node).wait::before { color:var(--warn); }
  :is(.stage, .node).done::before { content:"✓ "; color:var(--ok); }
  :is(.stage, .node).error::before { content:"✗ "; color:var(--bad); }
  #flow[data-preview] .stage:not(.on-preview), #flow[data-preview] .arrow, #flow[data-preview] #workers { opacity:.25; }
  #flow[data-preview] .stage.on-preview { border-color:var(--accent); }
  #flowHint { font-size:14px; min-height:20px; margin-top:6px; }
  .wrow { display:flex; gap:5px; align-items:center; flex-wrap:wrap; font-size:13px; padding:6px 0; border-top:1px solid var(--line); margin-top:6px; }
  .wrow .title { flex:1 1 100%; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node { border:1px solid var(--line); border-radius:99px; padding:1px 8px; color:var(--muted); }
  .node.done, .node.active, .node.wait, .node.error { color:var(--text); }

  /* tags, project chips */
  .tag { font-size:12px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .tag.draft { border-color:var(--warn); color:var(--warn); }
  .tag.ok { border-color:var(--ok); color:var(--ok); } .tag.fail { border-color:var(--bad); color:var(--bad); } .tag.pending { color:var(--muted); }
  .pc { font-size:13px; font-weight:600; padding:1px 8px; border-radius:6px; white-space:nowrap;
        background:hsl(var(--h) 45% 22%); color:hsl(var(--h) 80% 80%); border:1px solid hsl(var(--h) 40% 36%); }

  /* inbox */
  #inbox { display:grid; gap:10px; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin:-2px 0 10px; }
  .filters button { padding:2px 10px; font-size:13px; border-radius:99px; }
  .filters button[aria-pressed=true] { border-color:var(--accent); color:var(--accent); }
  .card { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--panel); display:grid; gap:8px; min-width:0; }
  .card.urgent { border-color:var(--warn); } .card.bad { border-color:var(--bad); }
  .ch { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .ic { width:22px; height:22px; border-radius:50%; display:inline-grid; place-items:center; font-size:13px; font-weight:700; background:var(--line); flex:none; }
  .urgent > .ch .ic { background:var(--warn); color:var(--on-accent); } .bad > .ch .ic { background:var(--bad); color:var(--on-accent); }
  .card .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
  label.plan { display:flex; gap:8px; align-items:baseline; font-size:15px; }
  .conflict pre { white-space:pre-wrap; max-height:8em; overflow:auto; font-size:13px; margin:4px 0; }
  li.prop { display:flex; gap:6px; align-items:center; font-size:15px; min-width:0; }
  li.prop details { flex:1; min-width:0; }
  li.prop summary { color:var(--text); font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li.prop button { padding:2px 8px; }

  /* projects */
  #projects { display:grid; gap:6px; }
  .prow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--panel); cursor:pointer; }
  .prow:hover { border-color:var(--accent); }
  .prow.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .prow .name { font-weight:650; flex:1 1 140px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .b { font-size:13px; padding:0 7px; border:1px solid var(--line); border-radius:99px; white-space:nowrap; }
  .b.dim { color:var(--muted); border-color:transparent; }
  .b.bad { border-color:var(--bad); color:var(--bad); } .b.wait { border-color:var(--warn); color:var(--warn); font-weight:700; }
  li.pr { display:flex; gap:8px; align-items:baseline; font-size:15px; min-width:0; flex-wrap:wrap; }
  li.pr a { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
  li.pr button { padding:1px 8px; font-size:13px; }
  #detail .stack { display:grid; gap:10px; }

  /* system */
  .chart svg { width:100%; height:70px; display:block; }
  .chart rect { fill:var(--accent); opacity:.85; } .chart rect:hover { opacity:1; }
  #toast { position:fixed; right:24px; bottom:80px; background:var(--panel); border:1px solid var(--accent); padding:10px 14px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; }
  #toast.show { opacity:1; }
  button[aria-pressed=true] { border-color:var(--accent); }

  /* blur: hide what PRs and tasks say, keep counts, states and buttons readable */
  body.blurred .sens { filter:blur(5px); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Harness</h1>
    <div class="status" id="status"><span class="muted">načítám…</span></div>
    <div class="quota" id="quotaMini"></div>
    <span class="spacer"></span>
    <button class="small" id="blurredToggle" aria-pressed="false" title="Rozmazat obsah PR a úkolů">🙈 Rozmazat</button>
  </header>

  <div class="bar">
    <button class="action primary" data-act="run" data-path="pick_tasks worker reflect">
      <b>▶ Zpracovat frontu</b><span id="runSub">Implementuje úkoly [ ] a otevře PR</span></button>
    <button class="action" data-act="go" data-path="discover prioritize approve pick_tasks worker reflect">
      <b>🔍 Najít a naplánovat</b><span>Opus navrhne úkoly, plán schválíš</span></button>
    <button class="action" data-act="go" data-lenses="cleanup" data-path="discover prioritize approve pick_tasks worker reflect">
      <b>🧹 Revize čistoty kódu</b><span>Opus najde spaghetti, navrhne refaktory</span></button>
    <details class="opts"><summary>⚙ Možnosti běhu</summary>
      <div class="pop">
        <div class="row" id="lenses"><span class="muted">Hledat:</span>
          <label class="chip"><input type="checkbox" value="fix" checked> Bugy a opravy</label>
          <label class="chip"><input type="checkbox" value="feature" checked> Nové features</label></div>
        <div class="row" id="limits"><span class="muted">Tento běh:</span>
          <label class="chip">max úkolů <input type="number" id="maxTasks" min="1"></label>
          <label class="chip">najednou <input type="number" id="maxParallel" min="1"></label></div>
      </div></details>
  </div>

  <section id="flow">
    <div class="pipe" id="pipe"></div>
    <div id="workers"></div>
    <div id="flowHint" class="muted"></div>
  </section>

  <div class="cols">
    <div class="col">
      <section><h2>Na mě čeká <span class="count" id="inboxCount">0</span></h2>
        <div class="filters" id="inboxFilter"></div>
        <div id="inbox"></div>
        <div id="inboxEmpty" class="muted" hidden></div></section>
    </div>

    <div class="col">
      <section><h2>Projekty <span class="count" id="projCount"></span><span class="spacer"></span>
        <button class="small" data-a="scopeAll" title="Do běhu zahrnout všechny projekty">vše</button></h2>
        <div id="projects"></div></section>
      <section id="detail" hidden>
        <h2 id="detailHead"></h2>
        <div class="stack"><div id="detailData"></div><div id="detailStatic"></div></div></section>
    </div>

    <div class="col">
      <section class="chart"><h2>Tokeny (14 dní)</h2><div id="chart"></div><div id="cost" class="muted"></div></section>
      <section id="lessonsBox" hidden><h2>Aktivní lekce</h2><div id="lessons"></div></section>
      <section><details><summary>Historie autorunu</summary><input type="date" id="historyDay"><pre id="history" class="muted"></pre></details></section>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let serveOn = false, boot = null, O = null, proposals = [], lessonsAll = [];
let selected = null, typeFilter = "", paused = false;
let keys = {status: "", projects: "", detail: "", detailStatic: "", lessons: "", filter: ""};
let excluded = new Set();  // unchecked in the project list; a new project starts checked
try { excluded = new Set(JSON.parse(localStorage.getItem("excluded") || "[]")); } catch (e) {}
const saveExcluded = () => { try { localStorage.setItem("excluded", JSON.stringify([...excluded])); } catch (e) {} };

function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.add("show");
  setTimeout(() => $("toast").classList.remove("show"), 3500);
}

async function call(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  toast(r.ok ? (data.message || "OK") : (data.detail || `chyba ${r.status}`));
  return r.ok;
}

async function act(action, body = {}) {
  const ok = await call(`/control/${action}`, body);
  refresh();
  return ok;
}

// two clicks instead of confirm(): a modal dialog would freeze the wallpaper (Lively)
function armed(button, label) {
  if (button.dataset.armed === "1") return true;
  button.dataset.armed = "1";
  button.textContent = "Opravdu?";
  setTimeout(() => { button.dataset.armed = ""; button.textContent = label; }, 4000);
  return false;
}

const hue = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 0);
const chip = name => `<span class="pc sens" style="--h:${hue(name)}">${esc(name)}</span>`;
const dis = () => serveOn ? "" : "disabled";
const plural = (n, one, few, many) => n === 1 ? one : n >= 2 && n <= 4 ? few : many;

function pickedNames() {
  return (O ? O.projects : []).map(p => p.name).filter(n => !excluded.has(n));
}

function scoped() {
  // all checked → no filter, so the daemon's own default (every project) applies
  const all = O ? O.projects.length : 0, picked = pickedNames();
  return picked.length === all ? {} : {projects: picked};
}

function limits() {
  // empty field → the daemon's projects.yaml value applies
  const out = {};
  for (const [key, id] of [["max_tasks", "maxTasks"], ["max_parallel", "maxParallel"]])
    if ($(id).value !== "") out[key] = Number($(id).value);
  return out;
}

function renderLimits(defaults) {
  // fill once; later refreshes must not overwrite what the owner typed
  if (!defaults) return;
  if ($("maxTasks").value === "") $("maxTasks").value = defaults.max_tasks;
  if ($("maxParallel").value === "") $("maxParallel").value = defaults.max_parallel;
}

function runBody(button) {
  // the cleanup button carries its own lens; both checkboxes checked → no filter; only "go" discovers
  const boxes = [...$("lenses").querySelectorAll("input")];
  const body = {...scoped(), ...limits()};
  if (button.dataset.lenses) return {...body, lenses: button.dataset.lenses.split(" ")};
  return button.dataset.act === "go" && !boxes.every(c => c.checked)
    ? {...body, lenses: boxes.filter(c => c.checked).map(c => c.value)} : body;
}

function renderRunSub() {
  const picked = new Set(pickedNames());
  const n = O.projects.filter(p => picked.has(p.name)).reduce((a, p) => a + p.counts[" "], 0);
  $("runSub").textContent = `${n} ${plural(n, "úkol", "úkoly", "úkolů")} ve frontě → implementace a PR`;
}

async function mergePr(button) {
  if (!armed(button, "Merge")) return;
  button.disabled = true;
  button.textContent = "merguju…";
  await call("/prs/merge", {project: button.dataset.project, number: +button.dataset.number});
  refresh();
}

async function settleConflict(button) {
  const action = button.dataset.conflict;
  if (action === "reimplement" && !armed(button, "Přeimplementovat")) return;  // closes the PR: two clicks, as for Merge
  button.disabled = true;
  await call("/prs/conflict", {project: button.dataset.project, number: +button.dataset.number, action});
  refresh();
}

async function approveAll(ids) {
  for (const task of ids) await call("/control/approve", {task});  // sequential: serve holds a lock per action
  refresh();
}

function ciTag(pr) {
  const label = {ok: "CI ✓", fail: "CI ✗", pending: "CI …"}[pr.ci];
  const conflict = pr.mergeable === "CONFLICTING" ? `<span class="tag fail">konflikt</span>` : "";
  return (label ? `<span class="tag ${pr.ci}">${label}</span>` : "") + conflict;
}

function age(iso) {
  const h = (Date.now() - new Date(iso)) / 36e5;
  return h < 24 ? `${Math.max(1, Math.round(h))} h` : `${Math.round(h / 24)} d`;
}

const ACTIVE = ["running", "waiting", "approving", "paused"];
const RUN_STATUS = {running: "běží", waiting: "čeká na tvou odpověď", approving: "čeká na schválení plánu",
  paused: "pauza kvůli limitu", done: "hotovo", crashed: "spadl", interrupted: "přerušen"};
const STAGES = [["discover", "Hledání", "Opus prochází projekty"], ["prioritize", "Prioritizace", "seřadí návrhy do plánu"],
  ["approve", "Schválení", "čeká na tebe"], ["pick_tasks", "Výběr", "vezme úkoly z fronty"],
  ["worker", "Práce", "paralelně na úkolech"], ["reflect", "Reflexe", "navrhne lekce"]];
const NODES = [["preflight", "kontrola"], ["make_worktree", "worktree"], ["plan", "plán"], ["clarify", "dotaz"],
  ["setup", "setup"], ["implement", "implementace"], ["verify", "testy"], ["replan", "replan"], ["open_pr", "PR"], ["report", "zápis"]];
const OUTCOME = {pr_opened: "PR otevřen", failed: "selhalo", needs_clarification: "nejasné"};
let runActive = false;
let agentResolving = false;

function renderStatus(s) {
  serveOn = !!s;
  paused = !!(s && s.paused);
  runActive = !!(s && s.run && ACTIVE.includes(s.run.status));
  document.querySelectorAll("button.action").forEach(b => {
    b.disabled = !serveOn || runActive;
    b.title = !serveOn ? "serve neběží" : runActive ? "běh už probíhá — počkej, až doběhne" : "";
  });
  const key = JSON.stringify(s);
  if (key === keys.status) return;  // an opened limits popover survives refreshes
  keys.status = key;
  if (!s) { $("status").innerHTML = `<span class="muted">serve neběží — tlačítka jsou vypnutá</span>`; return; }
  const run = s.run;
  $("status").innerHTML = `<span class="dot ${run ? run.status : ""}"></span>
    <span>${run ? `${esc(run.id)} — <b>${esc(RUN_STATUS[run.status] || run.status)}</b>` : "žádný běh"}</span>
    <details class="why"><summary>· autorun: <b>${s.paused ? "vypnutý" : "zapnutý"}</b></summary><div class="pop">${esc(s.limits.join("\n"))}</div></details>
    <button class="small" data-a="auto" title="Automatické spouštění fronty, návrhů a cleanup review v limitech projektu. Běžící běh nezastaví, ruční tlačítka fungují vždy.">${s.paused ? "Zapnout" : "Vypnout"}</button>`;
}

function stageState(name, p, run) {
  const st = p.stages[name];
  if (name === "approve" && run.status === "approving") return "wait";
  if (st === "active" && run.status === "paused") return "wait";
  if (st === "active" && run.status === "crashed") return "error";
  return st || "";
}

function nodeState(w, node, run) {
  const st = w.nodes[node];
  if (node === "clarify" && w.last === "clarify" && run.status === "waiting") return "wait";
  if (st === "active" && run.status === "paused") return "wait";
  return st || "";
}

let hint = "", hovered = null;

function renderFlow(p, run) {
  $("pipe").innerHTML = STAGES.map(([name, label, sub]) => {
    const extra = name === "discover" && Object.keys(p.discover).length
      ? Object.entries(p.discover).map(([proj, st]) => `<span class="sens">${esc(proj)}</span> ${st === "done" ? "✓" : "…"}`).join(" · ") : sub;
    return `<div class="stage ${stageState(name, p, run)}" data-stage="${name}">${label}<small>${extra}</small></div>`;
  }).join(`<span class="arrow">→</span>`);
  $("workers").innerHTML = p.workers.map(w => `<div class="wrow">
      <span class="title"><b>${esc(w.id)}</b> <span class="sens">${esc(w.title)}</span></span>
      ${NODES.filter(([n]) => !["clarify", "replan"].includes(n) || w.nodes[n]).map(([n, label]) =>
        `<span class="node ${nodeState(w, n, run)}">${label}${n === "implement" && w.attempts > 1 ? ` ×${w.attempts}` : ""}</span>`).join("")}
      ${w.outcome && w.nodes.report === "done" ? (w.pr_url ? `<a href="${esc(w.pr_url)}" target="_blank" rel="noopener">${OUTCOME[w.outcome] || esc(w.outcome)}</a>`
        : `<span class="tag ${w.outcome === "pr_opened" ? "ok" : "fail"}">${OUTCOME[w.outcome] || esc(w.outcome)}</span>`) : ""}</div>`).join("");
  $("flowHint").textContent = run.id ? `${run.id}: ${RUN_STATUS[run.status] || run.status}` : "Zatím žádný běh. Najeď na tlačítko a uvidíš, kudy půjde.";
  hint = $("flowHint").textContent;
  if ($("flow").dataset.preview && hovered) preview(hovered);  // a refresh under the mouse keeps the preview
}

async function refreshFlow(run) {
  if (!run) return renderFlow({stages: {}, discover: {}, workers: []}, {});
  try { renderFlow(await (await fetch(`/runs/${encodeURIComponent(run.id)}/progress`)).json(), run); } catch (e) {}
}

function preview(button) {
  const path = button.dataset.path.split(" ");
  hovered = button;
  $("flow").dataset.preview = button.dataset.act;
  $("pipe").querySelectorAll(".stage").forEach(el => el.classList.toggle("on-preview", path.includes(el.dataset.stage)));
  $("flowHint").textContent = button.dataset.act === "run"
    ? "Vezme úkoly [ ] z vybraných projektů podle priority, pro každý: worktree → plán → implementace → testy → PR. Nakonec reflexe."
    : button.dataset.lenses
    ? "Opus zreviduje celé repo vybraných projektů (zamotaný kód, duplicity, mrtvý kód) a navrhne refaktory bez změny chování. Plán schválíš, pak z nich udělá PR."
    : "Opus projde vybrané projekty a navrhne úkoly, seřadí je a počká, až plán schválíš. Schválené pak zpracuje jako frontu.";
}

function unpreview() {
  hovered = null;
  delete $("flow").dataset.preview;
  $("flowHint").textContent = hint;
}

/* ---------- inbox: everything that waits for the owner, most urgent first ---------- */

const item = (rank, group, project, key, sig, cls, html, n = 1) => ({rank, group, project, key, sig: JSON.stringify([sig, serveOn]), cls, html, n});
const head = (icon, project, text, extra = "") =>
  `<div class="ch"><span class="ic" aria-hidden="true">${icon}</span>${project ? chip(project) : ""}${text}${extra}</div>`;

function planItem(pl) {
  return item(0, "decide", "", `plan:${pl.id}`, pl.id, "urgent",
    head("!", "", `<b>Plán ke schválení</b>`, `<span class="muted">${pl.plan.length} ${plural(pl.plan.length, "úkol", "úkoly", "úkolů")}</span>`)
    + pl.plan.map((p, i) => `<label class="plan"><input type="checkbox" checked value="${i}"><span>${chip(p.project)}
        <span class="sens">${esc(p.title)}</span> <span class="tag">${p.source === "new" ? "nový" : "z BACKLOGu"}</span>${p.kind ? ` <span class="tag">${esc(p.kind)}</span>` : ""}
        ${p.why ? `<br><span class="muted sens">${esc(p.why)}</span>` : ""}</span></label>`).join("")
    + `<div class="row"><button class="primary" data-a="planOk">Schválit vybrané</button><button data-a="planQuit">Ukončit běh</button></div>`);
}

function questionItem(q) {
  return item(1, "decide", q.project, `q:${q.id}`, q.id, "urgent",
    head("?", q.project, `<b>${esc(q.task)}</b>`, `<span class="t sens">${esc(q.title)}</span>`)
    + `<div class="sens">${esc(q.question)}</div>
      <form class="row" data-form="answer" data-id="${esc(q.id)}"><input type="text" name="text" aria-label="Odpověď" required>
        <button class="primary">Odeslat</button><button type="button" data-a="skipQ" data-id="${esc(q.id)}">Přeskočit</button></form>`);
}

function conflictItem(project, pr) {
  const c = pr.conflict, d = `data-project="${esc(project)}" data-number="${pr.number}"`;
  const files = `<b>Konflikt</b> v <span title="${esc(c.files.join("\n"))}">${c.files.map(f => esc(f.split("/").pop())).join(", ")}</span>`;
  const body = c.state === "resolving" ? `<span class="muted">🤖 agent řeší konflikt a pouští testy…</span>`
    : `${c.state === "failed" ? `agent neuspěl:<pre class="sens">${esc(c.error)}</pre>` : ""}
      <div class="row"><button class="primary" data-a="conflict" data-conflict="agent" ${d}
        title="Merge main do větve, agent vyřeší konflikty, push jen když projde verify">Vyřešit agentem</button>
      <button data-a="conflict" data-conflict="reimplement" ${d} title="Zavře PR, smaže větev a vrátí úkol do fronty">Přeimplementovat</button>
      <button data-a="conflict" data-conflict="keep" ${d} title="Skrýt; PR zůstane s konflikty">Nechat</button></div>`;
  return item(2, "pr", project, `c:${project}#${pr.number}`, pr, "bad conflict",
    head("⚠", project, `<a class="t sens" href="${esc(pr.url)}" target="_blank" rel="noopener">#${pr.number} ${esc(prTitle(pr))}</a>`) + `<div>${files}</div>${body}`);
}

function readyItem(project, pr) {
  return item(4, "pr", project, `pr:${project}#${pr.number}`, pr, "",
    `<div class="ch"><span class="ic" aria-hidden="true">✓</span>${chip(project)}${prLine(project, pr)}</div>`);
}

function mergeItem(m) {
  return item(3, "decide", m.project, `m:${m.id}`, m, "",
    head("⇄", m.project, `<b class="sens">${m.titles.map(esc).join(" + ")}</b>`)
    + `<details><summary class="sens">→ ${esc(m.title)}</summary>${m.why ? `<p class="muted sens">${esc(m.why)}</p>` : ""}
        <p class="sens">${esc(m.description)}</p>${m.done ? `<p class="sens">Hotovo = ${esc(m.done)}</p>` : ""}</details>
      <div class="row"><button class="primary" data-a="mergeProp" data-id="${esc(m.id)}" data-accept="1" title="Nový návrh místo původních, ty se označí jako sloučené">Sloučit</button>
        <button data-a="mergeProp" data-id="${esc(m.id)}" title="Nechat návrhy zvlášť, tahle skupina se už nenabídne">Ignorovat</button></div>`);
}

function proposalItem(project, props) {
  const sorted = [...props].sort((a, b) => a.priority - b.priority);
  const p1 = sorted.filter(t => t.priority === 1).map(t => t.id);
  return item(5, "prop", project, `p:${project}`, sorted, "",
    head("◇", project, `<b>${props.length} ${plural(props.length, "návrh", "návrhy", "návrhů")}</b>`,
      `<span class="spacer"></span>${p1.length ? `<button class="small" data-a="approveAll" data-ids="${esc(p1.join(","))}" ${dis()} title="Schválit všechny návrhy s prioritou P1">Schválit P1 (${p1.length})</button>` : ""}`)
    + `<ul>${sorted.map(t => `<li class="prop">
        <details><summary title="${esc(t.title)}"><span class="muted">P${t.priority}</span> ${t.kind ? `<span class="tag">${esc(t.kind)}</span>` : ""}
          <span class="sens">${esc(t.title)}</span></summary>${t.description ? `<p class="sens">${esc(t.description)}</p>` : ""}</details>
        <button data-a="approve" data-task="${esc(t.id)}" title="Schválit → fronta" aria-label="Schválit" ${dis()}>✅</button>
        <button data-a="edit" data-task="${esc(t.id)}" title="Upravit" aria-label="Upravit" ${dis()}>✏️</button>
        <button data-a="reject" data-task="${esc(t.id)}" title="Zamítnout" aria-label="Zamítnout" ${dis()}>❌</button></li>`).join("")}</ul>`, props.length);
}

function lessonItem(proposed) {
  const btn = (l, approve, label, title) => `<button data-a="lesson" data-lesson="${esc(l.id)}" data-project="${esc(l.project)}"
      data-approve="${approve}" title="${title}" aria-label="${title}" ${dis()}>${label}</button>`;
  return item(6, "lesson", "", "l:proposed", proposed, "",
    head("✎", "", `<b>Lekce ke schválení</b>`) + `<ul>${proposed.map(l => `<li class="prop">${chip(l.project)}
        <span class="sens" style="flex:1;min-width:0">${esc(l.text)}</span>${btn(l, 1, "✅", "Platí")}${btn(l, 0, "❌", "Zahodit")}</li>`).join("")}</ul>`, proposed.length);
}

function inboxItems(o) {
  const s = o.serve, items = [];
  if (s && s.plan) items.push(planItem(s.plan));
  if (s) for (const q of s.questions.filter(q => !q.answered)) items.push(questionItem(q));
  for (const p of o.projects) for (const pr of p.prs || []) {
    if (pr.conflict && pr.conflict.state !== "kept") items.push(conflictItem(p.name, pr));
    else if (pr.ci === "ok" && !pr.isDraft && pr.mergeable !== "CONFLICTING") items.push(readyItem(p.name, pr));
  }
  if (s) for (const m of s.merges) items.push(mergeItem(m));
  for (const p of o.projects) {
    const props = o.proposals.filter(t => t.project === p.name);
    if (props.length) items.push(proposalItem(p.name, props));
  }
  const proposed = (s ? s.lessons : []).filter(l => l.status === "proposed");
  if (proposed.length) items.push(lessonItem(proposed));
  return items.sort((a, b) => a.rank - b.rank || a.project.localeCompare(b.project));
}

// keyed reconcile: a card whose content did not change keeps its DOM, so typed answers and opened <details> survive refreshes
function reconcile(box, items) {
  const have = new Map([...box.children].map(el => [el.dataset.key, el]));
  items.forEach((it, i) => {
    let el = have.get(it.key);
    if (!el || el.dataset.sig !== it.sig) {
      const fresh = document.createElement("div");
      fresh.className = `card ${it.cls}`;
      fresh.dataset.key = it.key;
      fresh.dataset.sig = it.sig;
      fresh.innerHTML = it.html;
      if (el) el.replaceWith(fresh);
      el = fresh;
    }
    have.delete(it.key);
    if (box.children[i] !== el) box.insertBefore(el, box.children[i] || null);
  });
  have.forEach(el => el.remove());
}

const GROUPS = [["", "Vše"], ["decide", "Rozhodnout"], ["pr", "PR"], ["prop", "Návrhy"], ["lesson", "Lekce"]];

function renderInbox(all) {

    $("inboxFilter").innerHTML = GROUPS.map(([g, label]) =>
      `<button data-a="filter" data-type="${g}" aria-pressed="${g === typeFilter}">${label} ${count(g)}</button>`).join("");
  }
  $("inboxEmpty").hidden = shown.length > 0;
  $("inboxEmpty").textContent = `Nic nečeká. ${!serveOn ? "Serve neběží." : paused ? "Autorun je vypnutý." : "Autorun běží."}`;
  reconcile($("inbox"), shown);
}

function cleanupBadge(c) {
  if (!c) return `<span class="b dim" title="Revize čistoty kódu zatím neproběhla">🧹 —</span>`;
  const days = Math.floor((Date.now() / 1000 - c.ts) / 86400);
  const title = `Poslední revize čistoty kódu ${new Date(c.ts * 1000).toLocaleDateString("cs")}; PR zmergované od té doby: ${c.prs === null ? "?" : c.prs}`;
  return `<span class="b ${days > 30 ? "dim" : ""}" title="${esc(title)}">🧹 ${days} d${c.prs === null ? "" : ` · ${c.prs} PR`}</span>`;
}

function prBadge(p) {
  if (p.prs === null) return `<span class="b bad" title="PR nejdou načíst (gh)">PR ?</span>`;
  if (!p.prs.length) return "";
  const bad = p.prs.some(x => x.ci === "fail" || x.mergeable === "CONFLICTING" || (x.conflict && x.conflict.state !== "kept"));
  return `<span class="b ${bad ? "bad" : ""}" title="${bad ? "PR s červeným CI nebo konfliktem" : "otevřená PR"}">${bad ? "✗ " : ""}${p.prs.length} PR</span>`;

    ${waiting ? `<span class="b wait" title="Čeká na tebe v Inboxu">! ${waiting}</span>` : ""}
    ${prBadge(p)}${num(c[" "], "fronta")}${num(c["~"], "návrhů")}${num(c["?"], "nejasné", "wait")}

function renderProjects(o, items) {

/* ---------- usage ---------- */

const meter = pct => `<div class="meter ${pct >= 70 ? "high" : ""}"><div style="width:${Math.min(pct, 100)}%"></div></div>`;

function quotaMeta(label, w, source) {
  const reset = w.resets_at ? new Date(w.resets_at * 1000).toLocaleString("cs-CZ", {weekday: "short", hour: "2-digit", minute: "2-digit"}) : "?";
  return `${label} · reset ${reset} · ${source}`;
}

// subscription cost is only the SDK's list-price estimate; API cost was really paid — never one number
function costLabel(cost, paid) {
  const est = cost - paid, parts = [];
  if (est.toFixed(2) !== "0.00") parts.push(`≈$${est.toFixed(2)} odhad (subscription)`);
  if (paid.toFixed(2) !== "0.00") parts.push(`$${paid.toFixed(2)} zaplaceno (API)`);
  return parts.join(" + ") || "$0.00";
}

function renderQuota(u) {
  const rl = u.rate_limit, source = rl && rl.status === "live" ? "živě" : "z posledního běhu";
  const chipOf = (label, pct, title, fallback = "") => `<span class="qchip" title="${esc(title)}"><span class="muted">${label}</span>
    ${pct == null ? `<b>${fallback}</b>` : `${meter(pct)}<b>${pct} %</b>`}</span>`;
  const parts = [];
  if (rl) {
    const pct = rl.utilization == null ? null : Math.round(rl.utilization * 100);
    // the live endpoint can fail; the SDK fallback reports utilization only near the limit (allowed_warning)
    parts.push(chipOf("5h", pct, quotaMeta("5h okno", rl, source) + (pct == null ? " · pod hranicí varování, přesné % SDK nehlásí" : ""),
      rl.status === "rejected" ? "vyčerpáno" : "OK"));
  }
  if (u.seven_day) {
    const pct = Math.round(u.seven_day.utilization * 100);
    parts.push(chipOf("7 dní", pct, quotaMeta("7 dní", u.seven_day, source)));
  }
  $("quotaMini").innerHTML = parts.join("") || `<span class="muted">kvóta: žádný běh zatím nenahlásil využití</span>`;
}

function renderUsage(u) {
  renderQuota(u);
  const days = [];
  for (let i = 13; i >= 0; i--) days.push(new Date(Date.now() - i * 864e5).toLocaleDateString("sv-SE"));
  const per = Object.fromEntries(days.map(d => [d, {tokens: 0, cost: 0, paid: 0}]));
  for (const r of u.summary) if (!r.simulated && per[r.day]) {
    per[r.day].tokens += r.input_tokens + r.output_tokens + r.cache_tokens;
    per[r.day].cost += r.cost_usd;
    per[r.day].paid += r.paid_usd ?? 0;
  }
  const max = Math.max(1, ...days.map(d => per[d].tokens)), w = 100 / days.length;
  $("chart").innerHTML = `<svg viewBox="0 0 100 70" preserveAspectRatio="none" role="img" aria-label="Tokeny po dnech">
    ${days.map((d, i) => { const h = per[d].tokens / max * 58;
      return `<rect x="${i * w + w * .15}" y="${60 - h}" width="${w * .7}" height="${h}"><title>${d}: ${per[d].tokens.toLocaleString("cs-CZ")} tokenů, ${costLabel(per[d].cost, per[d].paid)}</title></rect>`; }).join("")}
    </svg><div class="row muted" style="justify-content:space-between;font-size:12px"><span>${days[0].slice(5)}</span><span>dnes</span></div>`;
  const sum = k => days.reduce((a, d) => a + per[d][k], 0), today = per[days[13]];
  $("cost").textContent = `dnes ${today.tokens.toLocaleString("cs-CZ")} tokenů · 14 dní ${costLabel(sum("cost"), sum("paid"))}`;
}

/* ---------- loop ---------- */

async function planSession(name) {
  await call(`/projects/${encodeURIComponent(name)}/plan/session`);
}

async function loadPlan(d) {
  if (!d.open || d.dataset.loaded) return;
  const r = await fetch(`/projects/${encodeURIComponent(d.dataset.plan)}/plan`);
  d.querySelector("pre").textContent = r.ok ? (await r.json()).text : "plán nejde načíst";
  d.dataset.loaded = "1";
}

function render(o) {
  O = o;
  proposals = o.proposals;
  if (selected && !o.projects.some(p => p.name === selected)) selected = null;
  renderStatus(o.serve);
  renderLimits(o.limits);
  renderRunSub();
  const items = inboxItems(o);
  renderInbox(items);
  renderProjects(o, items);
  renderDetail(o);
  renderLessons(o.serve ? o.serve.lessons : []);
}

async function refresh() {
  try {
    const o = await (await fetch("/overview")).json();
    if (boot !== null && o.boot !== boot) return location.reload();  // serve restarted: load the new page
    boot = o.boot;
    render(o);
    refreshFlow(o.serve && o.serve.run);
  } catch (e) { $("status").innerHTML = `<span style="color:var(--bad)">dashboard nedostupný</span>`; keys.status = ""; }
}
async function refreshUsage() {
  try { renderUsage(await (await fetch("/usage")).json()); } catch (e) {}
}

async function loadHistory() {
  try { $("history").textContent = (await (await fetch(`/history?day=${$("historyDay").value}`)).json()).text; }
  catch (e) { $("history").textContent = "historie nedostupná"; }
}
$("historyDay").value = new Date().toLocaleDateString("sv");  // sv locale = YYYY-MM-DD in local time
$("historyDay").onchange = loadHistory;
loadHistory();

function setBlur(on) {
  // a per-viewer look: body class + localStorage, no server state
  document.body.classList.toggle("blurred", on);
  $("blurredToggle").setAttribute("aria-pressed", on);
  try { localStorage.setItem("blurred", on ? "1" : ""); } catch (e) {}
}
let blurOn = false;
try { blurOn = localStorage.getItem("blurred") === "1"; } catch (e) {}
setBlur(blurOn);
$("blurredToggle").onclick = () => setBlur(!document.body.classList.contains("blurred"));

document.querySelectorAll("button.action").forEach(b => {
  b.onclick = () => act(b.dataset.act, runBody(b));
  b.onmouseenter = b.onfocus = () => preview(b);
  b.onmouseleave = b.onblur = unpreview;
});

// one delegated handler: cards and rows are re-rendered freely, so nothing is bound to them
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b || e.target.matches("input")) return;
  const d = b.dataset;
  switch (d.a) {
    case "select": selected = selected === d.name ? null : d.name; keys.projects = ""; render(O); break;
    case "clearSel": selected = null; keys.projects = ""; render(O); break;
    case "scopeAll": excluded.clear(); saveExcluded(); keys.projects = ""; render(O); break;
    case "filter": typeFilter = d.type; render(O); break;
    case "auto": act(paused ? "resume" : "pause"); break;
    case "planOk": act("plan", {keep: [...b.closest(".card").querySelectorAll("input:checked")].map(c => +c.value)}); break;
    case "planQuit": act("plan", {keep: "q"}); break;
    case "skipQ": act("answer", {id: d.id, text: ""}); break;
    case "mergeProp": act("merge", {id: d.id, accept: !!d.accept}); break;
    case "mergePr": mergePr(b); break;
    case "conflict": settleConflict(b); break;
    case "approve": act("approve", {task: d.task}); break;
    case "approveAll": approveAll(d.ids.split(",")); break;
    case "edit": editProposal(b); break;
    case "reject": askReason(b); break;
    case "back": b.closest(".card").dataset.sig = ""; refresh(); break;  // a different sig makes the next render rebuild the card
    case "lesson": act("lesson", {project: d.project, id: d.lesson, approve: d.approve === "1"}); break;
    case "planCC": planSession(d.project); break;
  }
});

document.addEventListener("change", e => {
  if (!e.target.matches("input.scope")) return;
  e.target.checked ? excluded.delete(e.target.value) : excluded.add(e.target.value);
  saveExcluded();
  keys.projects = "";
  renderRunSub();
});

document.addEventListener("submit", async e => {
  const f = e.target, kind = f.dataset.form, v = f.elements;
  if (!kind) return;
  e.preventDefault();
  if (kind === "answer") act("answer", {id: f.dataset.id, text: v.text.value});
  else if (kind === "reject") act("reject", {task: f.dataset.task, reason: v.reason.value});
  else if (kind === "edit") act("edit", {task: f.dataset.task, title: v.title.value, description: v.description.value, done: v.done.value,
    priority: +v.priority.value, approve: e.submitter.value === "1"});
  else if (kind === "add" && await act("add", {project: f.dataset.project, title: v.title.value, description: v.description.value,
    done: v.done.value, priority: +v.priority.value})) f.reset();
});

// toggle does not bubble: capture it to load a project plan on first open
document.addEventListener("toggle", e => { if (e.target.matches("details[data-plan]")) loadPlan(e.target); }, true);

refresh(); refreshUsage();
let ticks = 0;
setInterval(() => { if (runActive || agentResolving || ++ticks % 5 === 0) refresh(); }, 3000);  // live while a run or conflict agent is active
setInterval(refreshUsage, 60000);

// drag-to-scroll: Lively may not forward the wheel; a drag past 5px scrolls the column and swallows the click
const NO_DRAG = "button, a, input, select, textarea, label, summary, pre";
for (const col of document.querySelectorAll(".cols > .col")) {
  let startY = null, startTop = 0, dragged = false;
  col.addEventListener("pointerdown", e => {
    dragged = false;
    if (e.button !== 0 || e.target.closest(NO_DRAG) || col.scrollHeight <= col.clientHeight) return;
    startY = e.clientY; startTop = col.scrollTop;
  });
  col.addEventListener("pointermove", e => {
    if (startY === null) return;
    if (!dragged && Math.abs(e.clientY - startY) < 5) return;
    if (!dragged) { dragged = true; col.classList.add("dragging"); try { col.setPointerCapture(e.pointerId); } catch (_) {} }  // throws on Lively's forwarded (button-less) moves
    col.scrollTop = startTop - (e.clientY - startY);
  });
  const end = () => { startY = null; col.classList.remove("dragging"); };
  col.addEventListener("pointerup", end);
  col.addEventListener("pointercancel", end);
  col.addEventListener("click", e => { if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);
}
</script>
</body>
