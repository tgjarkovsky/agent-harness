# Příkazy ověřené 2026-10-01 v čerstvém worktree z origin/main přes cmd.exe (harness sh()).
defaults:
  max_attempts: 3
  max_diff_lines: 800
billing: subscription
max_tasks_per_run: 3
quota_threshold: 0.7
max_parallel: 2
# model plánovače; A/B od 2026-10-11 (Opus plan stál ~$0.20, 1,6× implement) — porovnat merged/[!] v harness stats
plan_model: sonnet
# fokus: kolik záznamů v Thoughts/ a Inbox/ za posledních 14 dní zmiňuje projekt → rozhoduje remízy priorit
secondbrain: {path: ../secondbrain, days: 14}
# harness serve: autorun kdykoli v limitech (serve.py), digest do Telegramu 1× denně v digest_at, sken TODO 1× denně
serve: {digest_at: "07:00", question_timeout_hours: 24, scan: true}

projects:
  guth-pictures:
    path: ../guth-pictures
    base: main
    setup: ["npm ci"]
    # visual-components.test.tsx padá na main (IntersectionObserver v jsdom) — vyřazeno, ať gate pokrývá zbytek
    verify: ['npx vitest run --exclude "**/visual-components.test.tsx" --exclude "**/node_modules/**"', "npx tsc --noEmit"]
  akano3:
    path: ../akano3
    base: main
    setup: ["npm ci"]
    verify: ["node --test lib/*.test.mjs", "npx tsc --noEmit"]
  secondbrain:
    path: ../secondbrain
    base: main
    # venv mimo worktree: .venv není v secondbrainu gitignored
    setup: ["npm ci --prefix web", 'python -m venv ..\_venv && ..\_venv\Scripts\python -m pip install -q -r bot\requirements.txt pytest']
    # -X utf8: test_vault padá na Windows cp1252; bot běží na Linuxu (GitHub Actions)
    verify: ['..\_venv\Scripts\python -X utf8 -m pytest bot -q', "npm test --prefix web"]
    allowed: ["bot/**", "web/**", "scripts/**", "CHANGELOG.md"]
  linkedin:
    path: ../linkedin
    base: main
    setup: ["npm ci"]
    verify: ["node --test editor/*.test.ts", "npx tsc --noEmit"]
  kytky:
    path: ../kytky
    base: master
    setup: ["npm ci"]
    # next typegen: globální PageProps/LayoutProps vznikají až při buildu, v čistém worktree by tsc padal
    verify: ["npm test", "npx next typegen", "npx tsc --noEmit"]
    # Claude přes MCP produkce doplní kytky s needsSetup (druh, intervaly, nároky); MCP_SECRET z kytky/.env.local
    idle: {cmd: '..\harness\.venv\Scripts\python.exe ..\harness\scripts\kytky_fill.py', every: 24h}
  faktury:
    path: ../faktury
    base: master
    setup: ["npm ci"]
    # next typegen: stejný důvod jako u kytek
    verify: ["npm test", "npx next typegen", "npx tsc --noEmit"]
  discord-noter:
    path: ../discord-noter
    base: master
    # venv mimo worktree, sdílený úkoly projektu (instalace faster-whisper + pycord z gitu trvá)
    setup: ['python -m venv ..\_dvenv && ..\_dvenv\Scripts\python -m pip install -q -r requirements.txt pytest']
    verify: ['..\_dvenv\Scripts\python -X utf8 -m pytest -q']
  # harness upravuje sám sebe (discover, reflexe, ručně); pojistky mimo dosah, merge jen ručně z dashboardu
  harness:
    path: .
    base: main
    # venv mimo worktree, sdílený úkoly harnessu
    setup: ['python -m venv ..\_hvenv && ..\_hvenv\Scripts\python -m pip install -q -e ".[dev]"']
    verify: ['..\_hvenv\Scripts\python -m pytest -q']
    # guard (diff filtr), sdk (NO_PUBLISH), quota (OAuth token), tahle konfigurace
    allowed: ["!harness/guard.py", "!harness/sdk.py", "!harness/quota.py", "!projects.yaml"]
